<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VIBE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07070C">
<meta name="description" content="VIBE — rede social futurista para compartilhar fotos e vídeos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIBE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070C;
    --glass:rgba(255,255,255,0.05);
    --glass-2:rgba(255,255,255,0.09);
    --stroke:rgba(255,255,255,0.10);
    --text:#F3F2FA;
    --muted:#8D89A6;
    --cyan:#4DE8FF;
    --magenta:#FF3DBD;
    --violet:#A78BFA;
    --lime:#C6FF5C;
    --danger:#FF5C6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; min-height:100dvh;
    background:#020204;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; color:var(--text);
    padding:28px 12px; overflow:hidden;
  }
  .bg-blob{ position:fixed; border-radius:50%; filter:blur(90px); opacity:0.55; z-index:0; }
  .bg-blob.b1{ width:420px; height:420px; background:radial-gradient(circle, var(--magenta), transparent 70%); top:-10%; left:-12%; animation:drift1 16s ease-in-out infinite; }
  .bg-blob.b2{ width:460px; height:460px; background:radial-gradient(circle, var(--cyan), transparent 70%); bottom:-14%; right:-10%; animation:drift2 19s ease-in-out infinite; }
  .bg-blob.b3{ width:340px; height:340px; background:radial-gradient(circle, var(--violet), transparent 70%); top:40%; right:20%; animation:drift3 14s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);} }
  @keyframes drift3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,50px) scale(1.15);} }

  .phone{
    width:390px; max-width:100%; height:832px; max-height:96vh;
    background:linear-gradient(180deg, #0B0B14, #07070C 40%);
    border-radius:46px; border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 0 0 8px #050507, 0 40px 100px -20px rgba(0,0,0,0.85),
      0 0 60px -10px rgba(167,139,250,0.25);
    overflow:hidden; position:relative; display:flex; flex-direction:column; z-index:1;
  }
  /* On real phones (installed PWA / small viewports) drop the mockup chrome and go edge-to-edge */
  @media (max-width:480px), (display-mode:standalone){
    body{ padding:0; overflow:hidden; }
    .bg-blob{ display:none; }
    .phone{
      width:100vw; width:100dvw; height:100vh; height:100dvh; max-height:none;
      border-radius:0; border:none; box-shadow:none;
    }
  }
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:0.05; z-index:5;
    background-image:radial-gradient(rgba(255,255,255,0.9) 0.6px, transparent 0.6px);
    background-size:3px 3px; }

  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 26px 2px; font-size:13px; font-weight:600; flex-shrink:0; padding-top:calc(env(safe-area-inset-top,0px) + 14px); }
  .statusbar .dot-icons{ display:flex; gap:5px; align-items:center; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; flex-shrink:0; gap:8px; }
  .logo{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; letter-spacing:0.5px;
    background:linear-gradient(100deg, var(--cyan), var(--violet), var(--magenta), var(--lime), var(--cyan));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hueflow 6s linear infinite;
    position:relative;
  }
  .logo::after{ content:'2027'; position:absolute; top:-2px; right:-30px; font-family:'Inter'; font-size:8px; font-weight:600; letter-spacing:1px; color:var(--muted); background:var(--glass); border:1px solid var(--stroke); padding:2px 4px; border-radius:5px; -webkit-text-fill-color:var(--muted); }
  @keyframes hueflow{ to{ background-position:300% center; } }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:37px;height:37px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:var(--glass); border:1px solid var(--stroke); color:var(--text); cursor:pointer; backdrop-filter:blur(10px); position:relative;
  }
  .icon-btn svg{ width:18px;height:18px; }
  .badge-dot{ position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--magenta); box-shadow:0 0 6px var(--magenta); display:none; }
  .badge-dot.show{ display:block; }
  .install-btn{
    display:none; align-items:center; gap:5px; font-size:11px; font-weight:600; font-family:'Space Grotesk';
    background:var(--glass-2); border:1px solid var(--stroke); color:var(--text); border-radius:14px; padding:7px 10px; cursor:pointer;
  }
  .install-btn.show{ display:inline-flex; }
  .install-btn svg{ width:13px;height:13px; }

  .view{ flex:1; overflow-y:auto; display:none; padding-bottom:110px; position:relative; z-index:1; -webkit-overflow-scrolling:touch; }
  .view.active{ display:block; }
  .view::-webkit-scrollbar{ display:none; }

  /* stories as orbs */
  .stories{ display:flex; gap:15px; padding:4px 18px 18px; overflow-x:auto; }
  .stories::-webkit-scrollbar{ display:none; }
  .story{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:64px; }
  .story .ring-spin{
    width:60px;height:60px;border-radius:50%; padding:3px; position:relative;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--violet), var(--cyan));
    animation:spin 5s linear infinite;
  }
  .story.seen .ring-spin{ animation:none; background:var(--glass-2); }
  .story .avatar{
    width:100%;height:100%;border-radius:50%; display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:16px; color:#0A0A10;
    border:3px solid #0B0B14; overflow:hidden;
  }
  .story .avatar img{ width:100%; height:100%; object-fit:cover; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .story .you-add{ position:relative; }
  .story .plus-badge{
    position:absolute; bottom:-1px; right:-1px; width:19px;height:19px;border-radius:50%;
    background:var(--magenta); border:2px solid #0B0B14; display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; color:#fff;
  }
  .story span{ font-size:11px; color:var(--muted); }

  /* feed glass cards */
  .post{
    margin:0 14px 16px; border-radius:26px; background:var(--glass);
    border:1px solid var(--stroke); backdrop-filter:blur(18px); overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .post-head{ display:flex; align-items:center; gap:10px; padding:14px 14px 10px; }
  .post-head .avatar{ width:34px;height:34px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:13px; color:#0A0A10; flex-shrink:0; overflow:hidden; }
  .post-head .avatar img{ width:100%;height:100%;object-fit:cover; }
  .post-head .who{ flex:1; min-width:0; }
  .post-head .uname{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:5px; }
  .post-head .uname .you-tag{ font-size:9.5px; font-weight:700; color:#0A0A10; background:linear-gradient(120deg,var(--cyan),var(--lime)); padding:2px 6px; border-radius:8px; letter-spacing:0.4px; }
  .post-head .loc{ font-size:11.5px; color:var(--muted); }
  .post-img-wrap{ position:relative; width:100%; aspect-ratio:4/5; background:#000; overflow:hidden; }
  .post-img-wrap img, .post-img-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .trend-badge{
    position:absolute; top:12px; left:12px; padding:5px 11px; border-radius:20px;
    background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke);
    font-size:11px; font-weight:600; display:flex; align-items:center; gap:4px;
    background-image:linear-gradient(100deg, var(--magenta), var(--lime));
    -webkit-background-clip:text; background-clip:text;
  }
  .trend-badge span{ -webkit-text-fill-color:initial; color:var(--text); background:none; }
  .video-badge{ position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; z-index:2; }
  .video-badge svg{ width:14px;height:14px; }
  .mute-btn{ position:absolute; bottom:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; z-index:3; cursor:pointer; }
  .mute-btn svg{ width:15px;height:15px; }
  .play-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity 0.15s ease; z-index:2; }
  .play-overlay.show{ opacity:1; }
  .play-overlay svg{ width:56px;height:56px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.6)); }
  .burst-heart{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; z-index:4; }
  .burst-heart svg{ width:90px; height:90px; filter:drop-shadow(0 0 30px var(--magenta)); }
  .burst-heart.pop{ animation:burst 0.75s ease; }
  @keyframes burst{ 0%{opacity:0; transform:scale(0.5);} 25%{opacity:1; transform:scale(1.05);} 40%{transform:scale(0.96);} 75%{opacity:1;} 100%{opacity:0; transform:scale(1.1);} }
  .actions{ display:flex; align-items:center; gap:13px; padding:12px 14px 2px; }
  .actions .icon-btn{ background:transparent; border:none; width:30px; height:30px; backdrop-filter:none; }
  .actions .icon-btn svg{ width:24px; height:24px; }
  .actions .spacer{ flex:1; }
  .heart-btn.liked svg{ fill:var(--magenta); stroke:var(--magenta); filter:drop-shadow(0 0 6px var(--magenta)); }
  .heart-btn.pulse{ animation:pulse 0.35s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .bookmark-btn.saved svg{ fill:var(--lime); stroke:var(--lime); filter:drop-shadow(0 0 6px var(--lime)); }
  .likes-line{ padding:2px 16px 0; font-size:13.5px; font-weight:600; }
  .caption{ padding:4px 16px 0; font-size:13.5px; line-height:1.45; }
  .caption b{ font-weight:600; margin-right:5px; }
  .view-comments{ padding:5px 16px 0; font-size:13px; color:var(--muted); cursor:pointer; }
  .timestamp{ padding:6px 16px 14px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }

  /* floating pill navbar */
  .navbar{
    position:absolute; left:16px; right:16px; bottom:18px; z-index:20;
    display:flex; align-items:center; justify-content:space-around;
    padding:12px 14px; border-radius:28px;
    background:rgba(15,14,22,0.65); backdrop-filter:blur(22px);
    border:1px solid var(--stroke); box-shadow:0 20px 50px -15px rgba(0,0,0,0.7);
    margin-bottom:env(safe-area-inset-bottom,0px);
  }
  .nav-btn{ background:none; border:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:4px; position:relative; }
  .nav-btn svg{ width:23px; height:23px; }
  .nav-btn.active{ color:var(--text); filter:drop-shadow(0 0 6px var(--cyan)); }
  .nav-btn.camera-nav{
    width:46px; height:36px; border-radius:14px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta), var(--lime));
    background-size:250% auto; animation:hueflow 5s linear infinite;
  }
  .nav-btn .profile-dot{
    width:24px;height:24px;border-radius:50%;
    background:linear-gradient(135deg, var(--lime), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:10.5px; color:#0A0A10; border:2px solid transparent;
  }
  .nav-btn.active .profile-dot{ border-color:var(--text); }
  .nav-dot{ position:absolute; top:-1px; right:2px; width:7px;height:7px;border-radius:50%; background:var(--magenta); box-shadow:0 0 5px var(--magenta); display:none; }
  .nav-dot.show{ display:block; }

  /* search grid */
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:4px 14px; }
  .grid3 .cell{ aspect-ratio:1; overflow:hidden; background:var(--glass); border-radius:14px; border:1px solid var(--stroke); position:relative; }
  .grid3 .cell img, .grid3 .cell video{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .grid3 .cell .cell-video-tag{ position:absolute; top:5px; right:5px; width:18px;height:18px; }
  .grid3 .cell .cell-video-tag svg{ width:100%;height:100%; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.8)); }
  .search-bar{ margin:8px 16px 12px; position:relative; }
  .search-bar input{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:16px;
    padding:11px 40px 11px 15px; color:var(--text); font-size:14px; font-family:'Inter'; backdrop-filter:blur(10px);
  }
  .search-bar input::placeholder{ color:var(--muted); }
  .search-bar .clear-search{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; display:none; padding:5px; }
  .search-bar .clear-search.show{ display:block; }
  .search-empty{ text-align:center; padding:50px 30px; color:var(--muted); font-size:13.5px; }

  /* profile */
  .profile-head{ padding:18px 20px 10px; display:flex; gap:18px; align-items:center; }
  .profile-avatar{
    width:78px;height:78px;border-radius:50%; flex-shrink:0;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center; animation:spin 8s linear infinite;
  }
  .profile-avatar span{ width:70px;height:70px;border-radius:50%; background:#0B0B14; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:26px; }
  .profile-stats{ display:flex; gap:22px; }
  .profile-stats div{ text-align:center; }
  .profile-stats .num{ font-family:'Space Grotesk'; font-weight:700; font-size:16px; }
  .profile-stats .lbl{ font-size:11.5px; color:var(--muted); }
  .profile-bio{ padding:0 20px 10px; font-size:13.5px; }
  .profile-bio b{ display:block; font-size:14px; margin-bottom:2px; }
  .profile-tabs{ display:flex; gap:8px; padding:6px 18px 12px; }
  .profile-tab{ flex:1; text-align:center; padding:9px; border-radius:14px; background:var(--glass); border:1px solid var(--stroke); font-size:12.5px; font-weight:600; font-family:'Space Grotesk'; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .profile-tab svg{ width:15px;height:15px; }
  .profile-tab.active{ color:var(--text); background:var(--glass-2); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16); }
  .empty-state{ text-align:center; padding:60px 30px; color:var(--muted); }
  .empty-state button{
    margin-top:16px; border:none; padding:11px 22px; border-radius:20px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta)); font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; cursor:pointer;
  }

  /* activity */
  .activity-item{ display:flex; align-items:center; gap:12px; padding:11px 18px; }
  .activity-item .avatar{ width:38px;height:38px;border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; color:#0A0A10; font-size:14px; overflow:hidden;}
  .activity-item .avatar img{ width:100%;height:100%;object-fit:cover; }
  .activity-item .txt{ flex:1; font-size:13.5px; line-height:1.4; }
  .activity-item .txt .u{ font-weight:600; }
  .activity-item .time{ font-size:11.5px; color:var(--muted); }
  .activity-item .thumb{ width:40px;height:40px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--stroke);}
  .section-title{ font-family:'Space Grotesk'; font-weight:600; font-size:15px; padding:14px 18px 6px; }

  /* camera overlay */
  .camera-view{ position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:30; }
  .camera-view.active{ display:flex; }
  .camera-view video{ flex:1; width:100%; object-fit:cover; background:#000; }
  .camera-topbar{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:16px; right:16px; display:flex; justify-content:space-between; z-index:2;}
  .camera-controls{ display:flex; align-items:center; justify-content:space-around; padding:16px 30px calc(env(safe-area-inset-bottom,10px) + 16px); background:#000; }
  .mode-switch{ position:absolute; bottom:118px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:22px; z-index:2; }
  .mode-switch button{ background:none; border:none; color:rgba(255,255,255,0.55); font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; letter-spacing:0.5px; cursor:pointer; padding:4px 2px; text-transform:uppercase; }
  .mode-switch button.active{ color:#fff; text-shadow:0 0 10px var(--cyan); }
  .shutter{
    width:68px; height:68px; border-radius:50%; cursor:pointer; padding:3px;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--cyan));
    animation:spin 4s linear infinite; border:none;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .shutter::after{ content:""; width:100%; height:100%; border-radius:50%; background:#0A0A10; transition:border-radius 0.2s ease, background 0.2s ease; }
  .shutter.recording{ animation:none; background:var(--danger); }
  .shutter.recording::after{ border-radius:16px; width:60%; height:60%; background:var(--danger); }
  .rec-timer{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); background:rgba(255,92,108,0.9); color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:12px; padding:5px 12px; border-radius:14px; display:none; align-items:center; gap:6px; z-index:3; }
  .rec-timer.show{ display:flex; }
  .rec-timer .dot{ width:7px;height:7px;border-radius:50%; background:#fff; animation:blink 1s infinite; }
  @keyframes blink{ 50%{opacity:0.3;} }
  .cam-side-btn{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.12); backdrop-filter:blur(10px); border:1px solid var(--stroke); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cam-side-btn svg{ width:22px;height:22px; }
  .camera-hint{ position:absolute; bottom:150px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.75); font-size:12.5px; z-index:2;}
  #fileInput{ display:none; }

  .preview-view{ position:absolute; inset:0; background:#07070C; display:none; flex-direction:column; z-index:31; }
  .preview-view.active{ display:flex; }
  .preview-img-wrap{ flex:1; overflow:hidden; background:#000; }
  .preview-img-wrap img, .preview-img-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-bottom{ padding:14px 18px calc(env(safe-area-inset-bottom,10px) + 14px); background:rgba(15,14,22,0.9); backdrop-filter:blur(20px); border-top:1px solid var(--stroke); }
  .ai-suggest-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:16px;
    background:var(--glass-2); border:1px solid var(--stroke); color:var(--text); font-size:12px; font-weight:600;
    cursor:pointer; margin-bottom:10px; font-family:'Inter';
  }
  .ai-suggest-btn svg{ width:14px; height:14px; }
  .preview-bottom textarea{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:14px;
    color:var(--text); font-family:'Inter'; font-size:13.5px; padding:10px 12px; resize:none; height:52px; margin-bottom:10px;
  }
  .preview-bottom input.loc-input{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:14px;
    color:var(--text); font-family:'Inter'; font-size:12.5px; padding:9px 12px; margin-bottom:10px;
  }
  .preview-actions{ display:flex; gap:10px; }
  .preview-actions button{ flex:1; padding:12px; border-radius:14px; border:none; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn-discard{ background:var(--glass-2); color:var(--text); }
  .btn-share{ background:linear-gradient(120deg, var(--cyan), var(--magenta)); color:#0A0A10; }
  .btn-share:disabled{ opacity:0.6; }

  /* story viewer */
  .story-view{ position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:40; }

<script>
(function(){
  const GRADIENTS = [
    'linear-gradient(135deg,#4DE8FF,#A78BFA)',
    'linear-gradient(135deg,#FF3DBD,#A78BFA)',
    'linear-gradient(135deg,#C6FF5C,#4DE8FF)',
    'linear-gradient(135deg,#FF3DBD,#C6FF5C)',
    'linear-gradient(135deg,#4DE8FF,#FF3DBD)',
    'linear-gradient(135deg,#A78BFA,#C6FF5C)'
  ];
  function gradFor(name){
    let h=0; for(const c of (name||'?')) h = (h*31 + c.charCodeAt(0)) % GRADIENTS.length;
    return GRADIENTS[h];
  }
  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id'+Date.now()+'-'+Math.random().toString(36).slice(2);
  }

  /* ---------------------------------------------------------------
     Camada de persistencia local (IndexedDB) — funciona offline,
     no navegador e como app instalado, sem precisar de um servidor.
     Guarda os metadados dos posts + os arquivos de foto/video (Blob).
  --------------------------------------------------------------- */
  const DB_NAME = 'vibe-db';
  const DB_VERSION = 1;
  let dbPromise = null;
  function openDB(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject)=>{
      if(!('indexedDB' in window)){ resolve(null); return; }
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e)=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('media')) db.createObjectStore('media');
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
    });
    return dbPromise;
  }
  async function idbSet(store, key, value){
    const db = await openDB();
    if(!db) return false;
    return new Promise((resolve)=>{
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value, key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    });
  }
  async function idbGet(store, key){
    const db = await openDB();
    if(!db) return undefined;
    return new Promise((resolve)=>{
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).get(key);
      r.onsuccess = ()=> resolve(r.result);
      r.onerror = ()=> resolve(undefined);
    });
  }
  async function idbDelete(store, key){
    const db = await openDB();
    if(!db) return false;
    return new Promise((resolve)=>{
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = ()=> resolve(true);
      tx.onerror = ()=> resolve(false);
    });
  }

  const mediaObjectUrls = {}; // mediaKey -> object URL (cache em memoria)
  async function storeMediaBlob(blob){
    const key = 'm_'+uid();
    const ok = await idbSet('media', key, blob);
    if(!ok){
      // fallback: localStorage com base64 (limite de tamanho menor)
      try{
        const b64 = await blobToDataURL(blob);
        localStorage.setItem('vibe-media-'+key, b64);
      }catch(e){}
    }
    return key;
  }
  async function getMediaUrl(mediaKey){
    if(mediaObjectUrls[mediaKey]) return mediaObjectUrls[mediaKey];
    let blob = await idbGet('media', mediaKey);
    if(!blob){
      const b64 = localStorage.getItem('vibe-media-'+mediaKey);
      if(b64){ mediaObjectUrls[mediaKey] = b64; return b64; }
      return null;
    }
    const url = URL.createObjectURL(blob);
    mediaObjectUrls[mediaKey] = url;
    return url;
  }
  async function deleteMedia(mediaKey){
    if(!mediaKey) return;
    if(mediaObjectUrls[mediaKey] && mediaObjectUrls[mediaKey].startsWith('blob:')){
      URL.revokeObjectURL(mediaObjectUrls[mediaKey]);
    }
    delete mediaObjectUrls[mediaKey];
    await idbDelete('media', mediaKey);
    localStorage.removeItem('vibe-media-'+mediaKey);
  }
  function blobToDataURL(blob){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  const SEED_POSTS = [

  async function loadPosts(){
    try{
      const raw = await idbGet('meta', 'posts');
      if(raw){ posts = JSON.parse(raw); return; }
    }catch(e){}
    try{
      const legacy = localStorage.getItem('vibe-posts');
      if(legacy){ posts = JSON.parse(legacy); return; }
    }catch(e){}
    posts = SEED_POSTS.slice();
  }
  async function savePosts(){
    const json = JSON.stringify(posts);
    const ok = await idbSet('meta', 'posts', json);
    if(!ok){
      try{ localStorage.setItem('vibe-posts', json); }catch(e){}
    }
  }

  function initials(name){ const clean = (name||'?').replace(/[^a-zA-Z]/g,''); return (clean[0]||'?').toUpperCase(); }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
  }

  /* Resolve a URL exibivel de um post: seed usa "img" remoto direto,
     posts do usuario usam mediaKey (indexedDB). Retorna via callback
     para permitir lookup assincrono sem travar a renderizacao. */
  function resolveSrc(p){
    if(p.mediaKey) return getMediaUrl(p.mediaKey);
    return Promise.resolve(p.img);
  }
  function resolveThumb(p){
    if(p.mediaType==='video') return Promise.resolve(p.thumb || p.img || '');
    return resolveSrc(p);
  }

  function postCard(p){

    el.innerHTML = `

        <div class="avatar" style="background:${gradFor(p.user)};">${initials(p.user)}</div>
        <div class="who"><div class="uname">${p.user}${isMine ? '<span class="you-tag">VOCE</span>' : ''}</div><div class="loc">${p.loc||''}</div></div>

      <div class="post-img-wrap">

        ${p.trending ? `<div class="trend-badge">🔥 <span>EM ALTA</span></div>` : ''}
        ${p.mediaType==='video' ? `<div class="video-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 8 6 4-6 4V8Z"/><rect x="2" y="4" width="20" height="16" rx="3"/></svg></div>` : ''}
        <div class="burst-heart"><svg viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="1"><path d="M12 21s-7.5-4.7-10-9.3C.3 8.2 2 4.5 5.7 4c2.1-.3 4 1 6.3 3.4C14.3 5 16.2 3.7 18.3 4c3.7.5 5.4 4.2 3.7 7.7C19.5 16.3 12 21 12 21z"/></svg></div>
      </div>
      <div class="actions">
        <button class="icon-btn heart-btn ${p.liked?'liked':''}"><svg viewBox="0 0 24 24" fill="${p.liked?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7.5-4.7-10-9.3C.3 8.2 2 4.5 5.7 4c2.1-.3 4 1 6.3 3.4C14.3 5 16.2 3.7 18.3 4c3.7.5 5.4 4.2 3.7 7.7C19.5 16.3 12 21 12 21z"/></svg></button>
        <button class="icon-btn comment-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
        <button class="icon-btn share-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
        <div class="spacer"></div>
        <button class="icon-btn bookmark-btn ${p.saved?'saved':''}"><svg viewBox="0 0 24 24" fill="${p.saved?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 16l-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg></button>

      <div class="likes-line">${p.likes.toLocaleString('pt-BR')} curtidas</div>
      <div class="caption"><b>${p.user}</b>${p.caption}</div>

      <div class="timestamp">${p.time}</div>
    `;
    const imgWrap = el.querySelector('.post-img-wrap');
    const slot = el.querySelector('.media-slot');
    resolveSrc(p).then(src=>{
      if(!src){ slot.textContent = 'midia indisponivel'; return; }
      if(p.mediaType === 'video'){
        slot.outerHTML = `<video class="post-video" src="${src}" ${p.thumb?`poster="${p.thumb}"`:''} playsinline loop muted></video><div class="play-overlay show"><svg viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)"><path d="M8 5v14l11-7Z"/></svg></div><button class="mute-btn"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M23 9 17 15M17 9l6 6"/></svg></button>`;
        wireVideo();
      } else {
        slot.outerHTML = `<img src="${src}" alt="post">`;
      }
    });
    function wireVideo(){
      const video = imgWrap.querySelector('.post-video');
      const overlay = imgWrap.querySelector('.play-overlay');
      const muteBtn = imgWrap.querySelector('.mute-btn');
      video.muted = true;
      video.addEventListener('click', (e)=>{
        if(e.target === muteBtn || muteBtn.contains(e.target)) return;
      });
      function togglePlay(){
        if(video.paused){ video.play().catch(()=>{}); overlay.classList.remove('show'); }
        else { video.pause(); overlay.classList.add('show'); }
      }
      video._togglePlay = togglePlay;
      video.addEventListener('click', togglePlay);
      muteBtn.onclick = (e)=>{
        e.stopPropagation();
        video.muted = !video.muted;
        muteBtn.querySelector('svg').innerHTML = video.muted
          ? '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M23 9 17 15M17 9l6 6"/>'
          : '<path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/>';
      };
    }
    const heartBtn = el.querySelector('.heart-btn');
    heartBtn.onclick = ()=> toggleLike(p, heartBtn, el);
    let lastTap = 0;
    imgWrap.addEventListener('click', (e)=>{
      if(e.target.closest('.mute-btn')) return;
      const now = Date.now();
      if(now - lastTap < 300){
        if(!p.liked) toggleLike(p, heartBtn, el);
        const burst = el.querySelector('.burst-heart');
        burst.classList.remove('pop'); void burst.offsetWidth; burst.classList.add('pop');
      }
      lastTap = now;
    });
    el.querySelector('.bookmark-btn').onclick = (e)=>{
      p.saved = !p.saved; e.currentTarget.classList.toggle('saved', p.saved);
      const svg = e.currentTarget.querySelector('svg');
      svg.setAttribute('fill', p.saved ? 'currentColor':'none');
      showToast(p.saved ? 'Salvo' : 'Removido dos salvos');
      savePosts();
    };
    el.querySelector('.share-btn').onclick = ()=> sharePost(p);
    el.querySelector('.comment-btn').onclick = ()=> openComments(p.id);
    el.querySelector('.view-comments').onclick = ()=> openComments(p.id);
    el.querySelector('.menu-btn').onclick = ()=> openPostMenu(p);
    return el;
  }

  async function sharePost(p){
    const shareText = `${p.caption} — via VIBE`;
    try{
      if(navigator.share){
        await navigator.share({ title:'VIBE', text: shareText, url: location.href });
        showToast('Compartilhado!');
        return;
      }
    }catch(e){ /* usuario cancelou ou nao suportado, cai no fallback */ }
    try{
      await navigator.clipboard.writeText(shareText + ' ' + location.href);
      showToast('Link copiado');
    }catch(e){
      showToast('Nao foi possivel compartilhar');
    }
  }

  function toggleLike(p, btn, cardEl){
    p.liked = !p.liked;
    p.likes += p.liked ? 1 : -1;
    btn.classList.toggle('liked', p.liked);
    btn.querySelector('svg').setAttribute('fill', p.liked ? 'currentColor':'none');
    btn.classList.remove('pulse'); void btn.offsetWidth; btn.classList.add('pulse');
    cardEl.querySelector('.likes-line').textContent = p.likes.toLocaleString('pt-BR') + ' curtidas';
    savePosts();
  }

    posts.forEach(p => list.appendChild(postCard(p)));

  function normalize(str){
    return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }

    const cell = document.createElement('div');
    cell.className = 'cell';

    cell.innerHTML = thumb ? `<img src="${thumb}">` : '';
    if(p.mediaType === 'video'){
      const tag = document.createElement('div');
      tag.className = 'cell-video-tag';
      tag.innerHTML = '<svg viewBox="0 0 24 24" fill="#fff"><path d="m10 8 6 4-6 4V8Z"/><rect x="2" y="4" width="20" height="16" rx="3" fill="none" stroke="#fff" stroke-width="2"/></svg>';

    return cell;

  async function renderSearch(query){
    const grid = document.getElementById('searchGrid');
    const emptyEl = document.getElementById('searchEmpty');
    grid.innerHTML = '';
    const q = normalize(query||'');
    const filtered = q ? posts.filter(p=> normalize(p.user).includes(q) || normalize(p.caption).includes(q) || normalize(p.loc).includes(q)) : posts;
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    for(const p of filtered){
      grid.appendChild(await gridCell(p));
    }
  }

    const list = document.getElementById('commentsList');
    list.innerHTML = p.comments.length ? '' : '<div style="text-align:center;color:var(--muted);font-size:13px;padding:30px 0;">Seja o primeiro a comentar</div>';

    document.getElementById('commentsSheet').classList.remove('active');

  function sendComment(){
    const input = document.getElementById('commentInput');
    const text = input.value.trim();

    const p = posts.find(x=>x.id===activeCommentPostId);
    p.comments.push({user:'voce', text});
    input.value = '';
    openComments(activeCommentPostId);
    renderFeed();
    savePosts();

      document.getElementById('sheetBackdrop').classList.remove('active');

  async function confirmDelete(p){
    closePostMenu();
    document.getElementById('sheetBackdrop').classList.remove('active');
    if(!confirm('Excluir esta publicacao? Essa acao nao pode ser desfeita.')) return;
    await deletePost(p.id);
  }
  async function deletePost(postId){
    const p = posts.find(x=>x.id===postId);
    if(!p) return;
    if(p.mediaKey) await deleteMedia(p.mediaKey);
    posts = posts.filter(x=>x.id!==postId);
    await savePosts();
    renderFeed(); renderProfile(); renderSearch(searchInput.value);
    document.getElementById('viewerBackdrop').classList.remove('active');
    document.getElementById('viewerInner').innerHTML = '';
    showToast('Publicacao excluida');
  }

  /* ---------------- Visualizador (grid -> post completo) ---------------- */
  async function openPostViewer(p){
    const inner = document.getElementById('viewerInner');
    inner.innerHTML = '';
    inner.appendChild(postCard(p));
    document.getElementById('viewerBackdrop').classList.add('active');
  }
  document.getElementById('viewerCloseBtn').onclick = ()=> document.getElementById('viewerBackdrop').classList.remove('active');

  /* ---------------- Stories ---------------- */
  let storyTimer = null;
  function openStory(s){
    document.getElementById('storyAvatar').style.background = gradFor(s.user);
    document.getElementById('storyAvatar').textContent = initials(s.user);
    document.getElementById('storyUname').textContent = s.user;
    document.getElementById('storyImg').src = s.img;
    const prog = document.getElementById('storyProgress');
    prog.innerHTML = STORY_USERS.map(()=> '<div class="bar"><i></i></div>').join('');
    const idx = STORY_USERS.indexOf(s);
    const bars = prog.querySelectorAll('.bar');
    bars.forEach((b,i)=>{ if(i<idx) b.classList.add('done'); });
    bars[idx].classList.add('playing');
    document.getElementById('storyView').classList.add('active');
    clearTimeout(storyTimer);
    storyTimer = setTimeout(closeStory, 4000);
  }
  function closeStory(){
    document.getElementById('storyView').classList.remove('active');
    clearTimeout(storyTimer);
  }
  document.getElementById('closeStoryBtn').onclick = closeStory;
  document.getElementById('storyView').addEventListener('click', (e)=>{ if(e.target.id==='storyView') closeStory(); });

  /* ---------------- Camera: foto + video ---------------- */
  async function openCamera(){
    document.getElementById('cameraView').classList.add('active');
    setMode('photo');
    await startStream();
  }
  function setMode(mode){
    captureMode = mode;
    document.querySelectorAll('#modeSwitch button').forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
    document.getElementById('cameraHint').textContent = mode==='photo' ? 'Toque no botao para capturar' : 'Toque e segure para gravar';
    startStream();
  }
  document.querySelectorAll('#modeSwitch button').forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));

  async function startStream(){
    stopStream();
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: captureMode==='video' });
      const video = document.getElementById('video');
      video.srcObject = cameraStream;
      video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'scaleX(1)';
    }catch(err){
      document.getElementById('cameraHint').textContent = 'Camera indisponivel — use a galeria';
    }
  }
  function stopStream(){
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  }
  document.getElementById('closeCameraBtn').onclick = ()=>{
    stopStream();
    document.getElementById('cameraView').classList.remove('active');
  };
  document.getElementById('flipCameraBtn').onclick = ()=>{
    facingMode = facingMode==='user' ? 'environment' : 'user';
    startStream();
  };

  function capturePhotoFromVideo(){
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const targetW = 480;
    const targetH = Math.round(targetW * (video.videoHeight/video.videoWidth || 1.25));
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.save();
    if(facingMode==='user'){ ctx.translate(targetW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, 0, 0, targetW, targetH);
    ctx.restore();
    canvas.toBlob(blob=>{
      capturedBlob = blob; capturedMediaType = 'image'; capturedThumb = canvas.toDataURL('image/jpeg',0.6);
      openPreview();
    }, 'image/jpeg', 0.72);
  }

  function startRecording(){
    if(!cameraStream || !window.MediaRecorder) { showToast('Gravacao nao suportada'); return; }
    recordedChunks = [];
    let mime = '';
    ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].some(m=>{
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){ mime = m; return true; }
      return false;
    });
    try{
      mediaRecorder = mime ? new MediaRecorder(cameraStream, {mimeType:mime}) : new MediaRecorder(cameraStream);
    }catch(e){ showToast('Gravacao nao suportada'); return; }
    mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    document.getElementById('shutterBtn').classList.add('recording');
    document.getElementById('recTimer').classList.add('show');
    recStartedAt = Date.now();
    recTimerInterval = setInterval(()=>{
      const secs = Math.floor((Date.now()-recStartedAt)/1000);
      const m = Math.floor(secs/60), s = secs%60;
      document.getElementById('recTimerText').textContent = m+':'+String(s).padStart(2,'0');
      if(secs >= 15) stopRecording();
    }, 250);
  }
  function stopRecording(){
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    clearInterval(recTimerInterval);
    document.getElementById('shutterBtn').classList.remove('recording');
    document.getElementById('recTimer').classList.remove('show');
  }
  async function onRecordingStop(){
    if(!recordedChunks.length) return;
    const blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'video/webm'});
    capturedBlob = blob;
    capturedMediaType = 'video';
    capturedThumb = await generateVideoThumb(blob);
    openPreview();
  }
  function generateVideoThumb(blob){
    return new Promise(resolve=>{
      const v = document.getElementById('hiddenVideoProcessor');
      const url = URL.createObjectURL(blob);
      v.src = url;
      v.onloadeddata = ()=>{ v.currentTime = Math.min(0.15, (v.duration||1)/4); };
      v.onseeked = ()=>{
        const canvas = document.getElementById('canvas');
        canvas.width = 360; canvas.height = Math.round(360*(v.videoHeight/v.videoWidth||1.25));
        canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.6));
        URL.revokeObjectURL(url);
      };
      v.onerror = ()=> resolve(null);
    });
  }

  const shutterBtn = document.getElementById('shutterBtn');
  shutterBtn.addEventListener('pointerdown', (e)=>{
    if(!document.getElementById('video').srcObject){ document.getElementById('fileInput').click(); return; }
    if(captureMode==='video'){
      pressTimer = setTimeout(()=> startRecording(), 180);
    }
  });
  shutterBtn.addEventListener('pointerup', ()=>{
    clearTimeout(pressTimer);
    if(captureMode==='video'){
      if(mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    } else {
      if(document.getElementById('video').srcObject) capturePhotoFromVideo();
    }
  });
  shutterBtn.addEventListener('pointerleave', ()=>{
    if(mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  });

  document.getElementById('galleryBtn').onclick = ()=> document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.type.startsWith('video/')){
      capturedBlob = file;
      capturedMediaType = 'video';
      capturedThumb = await generateVideoThumb(file);
      openPreview();
    } else {
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const canvas = document.getElementById('canvas');
          const targetW = 480;
          const targetH = Math.round(targetW * (img.height/img.width));
          canvas.width = targetW; canvas.height = targetH;
          canvas.getContext('2d').drawImage(img,0,0,targetW,targetH);
          canvas.toBlob(blob=>{
            capturedBlob = blob; capturedMediaType = 'image'; capturedThumb = canvas.toDataURL('image/jpeg',0.6);
            openPreview();
          }, 'image/jpeg', 0.75);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    e.target.value = '';
  });

  function openPreview(){
    const wrap = document.getElementById('previewMediaWrap');
    const url = URL.createObjectURL(capturedBlob);
    wrap.innerHTML = capturedMediaType === 'video'
      ? `<video src="${url}" controls playsinline muted autoplay loop></video>`
      : `<img src="${url}" alt="preview">`;
    document.getElementById('captionInput').value = '';
    document.getElementById('locInput').value = '';
    document.getElementById('previewView').classList.add('active');
  }
  document.getElementById('closePreviewBtn').onclick = document.getElementById('discardBtn').onclick = ()=>{
    document.getElementById('previewView').classList.remove('active');
    document.getElementById('previewMediaWrap').innerHTML = '';
  };
  document.getElementById('aiSuggestBtn').onclick = ()=>{
    const idea = CAPTION_IDEAS[Math.floor(Math.random()*CAPTION_IDEAS.length)];
    document.getElementById('captionInput').value = idea;
  };
  document.getElementById('shareBtn').onclick = async ()=>{
    const shareBtn = document.getElementById('shareBtn');
    shareBtn.disabled = true;
    document.getElementById('uploadProgress').classList.add('show');
    try{
      const caption = document.getElementById('captionInput').value.trim() || 'novo momento capturado ✨';
      const loc = document.getElementById('locInput').value.trim() || 'Agora';
      const mediaKey = await storeMediaBlob(capturedBlob);
      posts.unshift({
        id:'u'+Date.now(), user:'voce', loc, mediaType: capturedMediaType,
        mediaKey, thumb: capturedMediaType==='video' ? capturedThumb : null,
        caption, likes:0, liked:false, saved:false, comments:[], time:'AGORA'
      });
      document.getElementById('previewView').classList.remove('active');
      document.getElementById('previewMediaWrap').innerHTML = '';
      document.getElementById('cameraView').classList.remove('active');
      stopStream();
      switchView('feed');
      renderFeed(); renderProfile(); renderSearch(searchInput.value);
      await savePosts();
      showToast('Publicado!');
      simulateEngagement();
    } catch(err){
      showToast('Erro ao publicar, tente novamente');
    } finally {
      shareBtn.disabled = false;
      document.getElementById('uploadProgress').classList.remove('show');
    }
  };

  /* Simula atividade de outros usuarios reagindo a uma nova publicacao,
     ja que o app roda localmente sem uma rede social real por tras. */
  function simulateEngagement(){
    const engager = SIMULATED_ENGAGERS[Math.floor(Math.random()*SIMULATED_ENGAGERS.length)];
    setTimeout(()=>{
      ACTIVITY.unshift({avatar:engager, text:'curtiu sua foto', time:'agora'});
      hasUnseenActivity = true;
      document.getElementById('activityBadge').classList.add('show');
      document.getElementById('navActivityDot').classList.add('show');
    }, 4000 + Math.random()*4000);
  }

  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  tick(); setInterval(tick, 30000);

  /* ---------------- PWA: instalacao e service worker ---------------- */
  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBtn').classList.add('show');
  });
  document.getElementById('installBtn').onclick = async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBtn').classList.remove('show');
  };
  window.addEventListener('appinstalled', ()=>{
    document.getElementById('installBtn').classList.remove('show');
    showToast('VIBE instalado!');
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  (async function init(){
    await loadPosts();
    renderAll();
  })();
})();
</script>
</body>
</html>
