<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VIBE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07070C">
<meta name="description" content="VIBE — rede social futurista para compartilhar fotos e vídeos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIBE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070C;
    --glass:rgba(255,255,255,0.05);
    --glass-2:rgba(255,255,255,0.09);
    --stroke:rgba(255,255,255,0.10);
    --text:#F3F2FA;
    --muted:#8D89A6;
    --cyan:#4DE8FF;
    --magenta:#FF3DBD;
    --violet:#A78BFA;
    --lime:#C6FF5C;
    --danger:#FF5C6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; min-height:100dvh;
    background:#020204;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; color:var(--text);
    padding:28px 12px; overflow:hidden;
  }
  .bg-blob{ position:fixed; border-radius:50%; filter:blur(90px); opacity:0.55; z-index:0; }
  .bg-blob.b1{ width:420px; height:420px; background:radial-gradient(circle, var(--magenta), transparent 70%); top:-10%; left:-12%; animation:drift1 16s ease-in-out infinite; }
  .bg-blob.b2{ width:460px; height:460px; background:radial-gradient(circle, var(--cyan), transparent 70%); bottom:-14%; right:-10%; animation:drift2 19s ease-in-out infinite; }
  .bg-blob.b3{ width:340px; height:340px; background:radial-gradient(circle, var(--violet), transparent 70%); top:40%; right:20%; animation:drift3 14s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);} }
  @keyframes drift3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,50px) scale(1.15);} }

  .phone{
    width:390px; max-width:100%; height:832px; max-height:96vh;
    background:linear-gradient(180deg, #0B0B14, #07070C 40%);
    border-radius:46px; border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 0 0 8px #050507, 0 40px 100px -20px rgba(0,0,0,0.85),
      0 0 60px -10px rgba(167,139,250,0.25);
    overflow:hidden; position:relative; display:flex; flex-direction:column; z-index:1;
  }
  /* On real phones (installed PWA / small viewports) drop the mockup chrome and go edge-to-edge */
  @media (max-width:480px), (display-mode:standalone){
    body{ padding:0; overflow:hidden; }
    .bg-blob{ display:none; }
    .phone{
      width:100vw; width:100dvw; height:100vh; height:100dvh; max-height:none;
      border-radius:0; border:none; box-shadow:none;
    }
  }
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:0.05; z-index:5;
    background-image:radial-gradient(rgba(255,255,255,0.9) 0.6px, transparent 0.6px);
    background-size:3px 3px; }

  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 26px 2px; font-size:13px; font-weight:600; flex-shrink:0; padding-top:calc(env(safe-area-inset-top,0px) + 14px); }
  .statusbar .dot-icons{ display:flex; gap:5px; align-items:center; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; flex-shrink:0; gap:8px; }
  .logo{ cursor:pointer; }
  .logo:active{ opacity:0.75; }
  .logo{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; letter-spacing:0.5px;
    background:linear-gradient(100deg, var(--cyan), var(--violet), var(--magenta), var(--lime), var(--cyan));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hueflow 6s linear infinite;
    position:relative;
  }
  .logo::after{ content:'2027'; position:absolute; top:-2px; right:-30px; font-family:'Inter'; font-size:8px; font-weight:600; letter-spacing:1px; color:var(--muted); background:var(--glass); border:1px solid var(--stroke); padding:2px 4px; border-radius:5px; -webkit-text-fill-color:var(--muted); }
  @keyframes hueflow{ to{ background-position:300% center; } }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:37px;height:37px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:var(--glass); border:1px solid var(--stroke); color:var(--text); cursor:pointer; backdrop-filter:blur(10px); position:relative;
  }
  .icon-btn svg{ width:18px;height:18px; }
  .badge-dot{ position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--magenta); box-shadow:0 0 6px var(--magenta); display:none; }
  .badge-dot.show{ display:block; }
  .install-btn{
    display:none; align-items:center; gap:5px; font-size:11px; font-weight:600; font-family:'Space Grotesk';
    background:var(--glass-2); border:1px solid var(--stroke); color:var(--text); border-radius:14px; padding:7px 10px; cursor:pointer;
  }
  .install-btn.show{ display:inline-flex; }
  .install-btn svg{ width:13px;height:13px; }

  .view{ flex:1; overflow-y:auto; display:none; padding-bottom:110px; position:relative; z-index:1; -webkit-overflow-scrolling:touch; }
  .view.active{ display:block; }
  .view::-webkit-scrollbar{ display:none; }

  /* stories as orbs */
  .stories{ display:flex; gap:15px; padding:4px 18px 18px; overflow-x:auto; }
  .stories::-webkit-scrollbar{ display:none; }
  .story{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:64px; }
  .story .ring-spin{
    width:60px;height:60px;border-radius:50%; padding:3px; position:relative;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--violet), var(--cyan));
    animation:spin 5s linear infinite;
  }
  .story.seen .ring-spin{ animation:none; background:var(--glass-2); }
  .story .avatar{
    width:100%;height:100%;border-radius:50%; display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:16px; color:#0A0A10;
    border:3px solid #0B0B14; overflow:hidden;
  }
  .story .avatar img{ width:100%; height:100%; object-fit:cover; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .story .you-add{ position:relative; }
  .story .plus-badge{
    position:absolute; bottom:-1px; right:-1px; width:19px;height:19px;border-radius:50%;
    background:var(--magenta); border:2px solid #0B0B14; display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; color:#fff;
  }
  .story span{ font-size:11px; color:var(--muted); }

  /* feed glass cards */
  .post{
    margin:0 14px 16px; border-radius:26px; background:var(--glass);
    border:1px solid var(--stroke); backdrop-filter:blur(18px); overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .post-head{ display:flex; align-items:center; gap:10px; padding:14px 14px 10px; }
  .post-head .avatar{ width:34px;height:34px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:13px; color:#0A0A10; flex-shrink:0; overflow:hidden; }
  .post-head .avatar img{ width:100%;height:100%;object-fit:cover; }
  .post-head .who{ flex:1; min-width:0; }
  .post-head .uname{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:5px; }
  .post-head .uname .you-tag{ font-size:9.5px; font-weight:700; color:#0A0A10; background:linear-gradient(120deg,var(--cyan),var(--lime)); padding:2px 6px; border-radius:8px; letter-spacing:0.4px; }
  .post-head .loc{ font-size:11.5px; color:var(--muted); }
  .post-img-wrap{ position:relative; width:100%; aspect-ratio:4/5; background:#000; overflow:hidden; }
  .post-img-wrap img, .post-img-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .trend-badge{
    position:absolute; top:12px; left:12px; padding:5px 11px; border-radius:20px;
    background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke);
    font-size:11px; font-weight:600; display:flex; align-items:center; gap:4px;
    background-image:linear-gradient(100deg, var(--magenta), var(--lime));
    -webkit-background-clip:text; background-clip:text;
  }
  .trend-badge span{ -webkit-text-fill-color:initial; color:var(--text); background:none; }
  .video-badge{ position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; z-index:2; }
  .video-badge svg{ width:14px;height:14px; }
  .mute-btn{ position:absolute; bottom:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; z-index:3; cursor:pointer; }
  .mute-btn svg{ width:15px;height:15px; }
  .play-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity 0.15s ease; z-index:2; }
  .play-overlay.show{ opacity:1; }
  .play-overlay svg{ width:56px;height:56px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.6)); }
  .burst-heart{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; z-index:4; }
  .burst-heart svg{ width:90px; height:90px; filter:drop-shadow(0 0 30px var(--magenta)); }
  .burst-heart.pop{ animation:burst 0.75s ease; }
  @keyframes burst{ 0%{opacity:0; transform:scale(0.5);} 25%{opacity:1; transform:scale(1.05);} 40%{transform:scale(0.96);} 75%{opacity:1;} 100%{opacity:0; transform:scale(1.1);} }
  .actions{ display:flex; align-items:center; gap:13px; padding:12px 14px 2px; }
  .actions .icon-btn{ background:transparent; border:none; width:30px; height:30px; backdrop-filter:none; }
  .actions .icon-btn svg{ width:24px; height:24px; }
  .actions .spacer{ flex:1; }
  .heart-btn.liked svg{ fill:var(--magenta); stroke:var(--magenta); filter:drop-shadow(0 0 6px var(--magenta)); }
  .heart-btn.pulse{ animation:pulse 0.35s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .bookmark-btn.saved svg{ fill:var(--lime); stroke:var(--lime); filter:drop-shadow(0 0 6px var(--lime)); }
  .likes-line{ padding:2px 16px 0; font-size:13.5px; font-weight:600; }
  .caption{ padding:4px 16px 0; font-size:13.5px; line-height:1.45; }
  .caption b{ font-weight:600; margin-right:5px; }
  .view-comments{ padding:5px 16px 0; font-size:13px; color:var(--muted); cursor:pointer; }
  .timestamp{ padding:6px 16px 14px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }

  /* floating pill navbar */
  .navbar{
    position:absolute; left:16px; right:16px; bottom:18px; z-index:20;
    display:flex; align-items:center; justify-content:space-around;
    padding:12px 14px; border-radius:28px;
    background:rgba(15,14,22,0.65); backdrop-filter:blur(22px);
    border:1px solid var(--stroke); box-shadow:0 20px 50px -15px rgba(0,0,0,0.7);
    margin-bottom:env(safe-area-inset-bottom,0px);
  }
  .nav-btn{ background:none; border:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:4px; position:relative; }
  .nav-btn svg{ width:23px; height:23px; }
  .nav-btn.active{ color:var(--text); filter:drop-shadow(0 0 6px var(--cyan)); }
  .nav-btn.camera-nav{
    width:46px; height:36px; border-radius:14px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta), var(--lime));
    background-size:250% auto; animation:hueflow 5s linear infinite;
  }
  .nav-btn .profile-dot img{ width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  .nav-btn .profile-dot{
    width:24px;height:24px;border-radius:50%;
    background:linear-gradient(135deg, var(--lime), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:10.5px; color:#0A0A10; border:2px solid transparent;
  }
  .nav-btn.active .profile-dot{ border-color:var(--text); }
  .nav-dot{ position:absolute; top:-1px; right:2px; width:7px;height:7px;border-radius:50%; background:var(--magenta); box-shadow:0 0 5px var(--magenta); display:none; }
  .nav-dot.show{ display:block; }

  /* search grid */
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:4px 14px; }
  .grid3 .cell{ aspect-ratio:1; overflow:hidden; background:var(--glass); border-radius:14px; border:1px solid var(--stroke); position:relative; }
  .grid3 .cell img, .grid3 .cell video{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .grid3 .cell .cell-video-tag{ position:absolute; top:5px; right:5px; width:18px;height:18px; }
  .grid3 .cell .cell-video-tag svg{ width:100%;height:100%; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.8)); }
  .search-bar{ margin:8px 16px 12px; position:relative; }
  .search-bar input{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:16px;
    padding:11px 40px 11px 15px; color:var(--text); font-size:14px; font-family:'Inter'; backdrop-filter:blur(10px);
  }
  .search-bar input::placeholder{ color:var(--muted); }
  .search-bar .clear-search{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; display:none; padding:5px; }
  .search-bar .clear-search.show{ display:block; }
  .search-empty{ text-align:center; padding:50px 30px; color:var(--muted); font-size:13.5px; }

  /* profile */
  .profile-head{ padding:18px 20px 10px; display:flex; gap:18px; align-items:center; }
  .profile-avatar{
    width:78px;height:78px;border-radius:50%; flex-shrink:0;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center; animation:spin 8s linear infinite;
  }
  .profile-avatar span{ width:70px;height:70px;border-radius:50%; background:#0B0B14; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:26px; }
  .profile-stats{ display:flex; gap:22px; }
  .profile-stats div{ text-align:center; }
  .profile-stats .num{ font-family:'Space Grotesk'; font-weight:700; font-size:16px; }
  .profile-stats .lbl{ font-size:11.5px; color:var(--muted); }
  .profile-bio{ padding:0 20px 10px; font-size:13.5px; }
  .profile-bio b{ display:block; font-size:14px; margin-bottom:2px; }
  .profile-tabs{ display:flex; gap:8px; padding:6px 18px 12px; }
  .profile-tab{ flex:1; text-align:center; padding:9px; border-radius:14px; background:var(--glass); border:1px solid var(--stroke); font-size:12.5px; font-weight:600; font-family:'Space Grotesk'; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .profile-tab svg{ width:15px;height:15px; }
  .profile-tab.active{ color:var(--text); background:var(--glass-2); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16); }
  .empty-state{ text-align:center; padding:60px 30px; color:var(--muted); }
  .empty-state button{
    margin-top:16px; border:none; padding:11px 22px; border-radius:20px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta)); font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; cursor:pointer;
  }

  /* activity */
  .activity-item{ display:flex; align-items:center; gap:12px; padding:11px 18px; }
  .activity-item .avatar{ width:38px;height:38px;border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; color:#0A0A10; font-size:14px; overflow:hidden;}
  .activity-item .avatar img{ width:100%;height:100%;object-fit:cover; }
  .activity-item .txt{ flex:1; font-size:13.5px; line-height:1.4; }
  .activity-item .txt .u{ font-weight:600; }
  .activity-item .time{ font-size:11.5px; color:var(--muted); }
  .activity-item .thumb{ width:40px;height:40px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--stroke);}
  .section-title{ font-family:'Space Grotesk'; font-weight:600; font-size:15px; padding:14px 18px 6px; }

  /* camera overlay */
  .camera-view{ position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:30; }
  .camera-view.active{ display:flex; }
  .camera-view video{ flex:1; width:100%; object-fit:cover; background:#000; }
  .camera-topbar{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:16px; right:16px; display:flex; justify-content:space-between; z-index:2;}
  .camera-controls{ display:flex; align-items:center; justify-content:space-around; padding:16px 30px calc(env(safe-area-inset-bottom,10px) + 16px); background:#000; }
  .mode-switch{ position:absolute; bottom:118px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:22px; z-index:2; }
  .mode-switch button{ background:none; border:none; color:rgba(255,255,255,0.55); font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; letter-spacing:0.5px; cursor:pointer; padding:4px 2px; text-transform:uppercase; }
  .mode-switch button.active{ color:#fff; text-shadow:0 0 10px var(--cyan); }
  .shutter{
    width:68px; height:68px; border-radius:50%; cursor:pointer; padding:3px;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--cyan));
    animation:spin 4s linear infinite; border:none;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .shutter::after{ content:""; width:100%; height:100%; border-radius:50%; background:#0A0A10; transition:border-radius 0.2s ease, background 0.2s ease; }
  .shutter.recording{ animation:none; background:var(--danger); }
  .shutter.recording::after{ border-radius:16px; width:60%; height:60%; background:var(--danger); }
  .rec-timer{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); background:rgba(255,92,108,0.9); color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:12px; padding:5px 12px; border-radius:14px; display:none; align-items:center; gap:6px; z-index:3; }
  .rec-timer.show{ display:flex; }
  .rec-timer .dot{ width:7px;height:7px;border-radius:50%; background:#fff; animation:blink 1s infinite; }
  @keyframes blink{ 50%{opacity:0.3;} }
  .cam-side-btn{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.12); backdrop-filter:blur(10px); border:1px solid var(--stroke); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cam-side-btn svg{ width:22px;height:22px; }
  .camera-hint{ position:absolute; bottom:150px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.75); font-size:12.5px; z-index:2;}
  #fileInput{ display:none; }

  .preview-view{ position:absolute; inset:0; background:#07070C; display:none; flex-direction:column; z-index:31; }
  .preview-view.active{ display:flex; }
  .preview-img-wrap{ flex:1; overflow:hidden; background:#000; }
  .preview-img-wrap img, .preview-img-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-bottom{ padding:14px 18px calc(env(safe-area-inset-bottom,10px) + 14px); background:rgba(15,14,22,0.9); backdrop-filter:blur(20px); border-top:1px solid var(--stroke); }
  .ai-suggest-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:16px;
    background:var(--glass-2); border:1px solid var(--stroke); color:var(--text); font-size:12px; font-weight:600;
    cursor:pointer; margin-bottom:10px; font-family:'Inter';
  }
  .ai-suggest-btn svg{ width:14px; height:14px; }
  .preview-bottom textarea{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:14px;
    color:var(--text); font-family:'Inter'; font-size:13.5px; padding:10px 12px; resize:none; height:52px; margin-bottom:10px;
  }
  .preview-bottom input.loc-input{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:14px;
    color:var(--text); font-family:'Inter'; font-size:12.5px; padding:9px 12px; margin-bottom:10px;
  }
  .preview-actions{ display:flex; gap:10px; }
  .preview-actions button{ flex:1; padding:12px; border-radius:14px; border:none; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn-discard{ background:var(--glass-2); color:var(--text); }
  .btn-share{ background:linear-gradient(120deg, var(--cyan), var(--magenta)); color:#0A0A10; }
  .btn-share:disabled{ opacity:0.6; }

  /* story viewer */
  .story-view{ position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:40; }
  .story-view.active{ display:flex; }
  .story-progress{ display:flex; gap:4px; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0; }
  .story-progress .bar{ flex:1; height:2.5px; background:rgba(255,255,255,0.25); border-radius:2px; overflow:hidden; }
  .story-progress .bar i{ display:block; height:100%; width:0%; background:linear-gradient(90deg, var(--cyan), var(--magenta)); }
  .story-progress .bar.done i{ width:100%; }
  .story-progress .bar.playing i{ /* progresso controlado via JS para permitir pause */ }
  @keyframes fill{ from{width:0%;} to{width:100%;} }
  .story-head{ display:flex; align-items:center; gap:8px; padding:10px 14px; }
  .story-head .avatar{ width:30px;height:30px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:12px; color:#0A0A10;}
  .story-head .uname{ font-size:13px; font-weight:600; }
  .story-head .x{ margin-left:auto; background:none; border:none; color:#fff; cursor:pointer; }
  .story-body{ flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .story-body img{ width:100%; height:100%; object-fit:cover; }

  /* comments sheet & generic bottom sheet */
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.55); display:none; z-index:56; }
  .sheet-backdrop.active{ display:block; }
  .comments-sheet{
    position:absolute; left:0; right:0; bottom:0; height:62%;
    background:rgba(15,14,22,0.92); backdrop-filter:blur(24px);
    border-radius:26px 26px 0 0; border:1px solid var(--stroke); border-bottom:none;
    display:flex; flex-direction:column; transform:translateY(105%); transition:transform 0.28s ease; z-index:57;
  }
  .comments-sheet.active{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--stroke); margin:10px auto 4px; }
  .sheet-title{ text-align:center; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; padding:4px 0 10px; border-bottom:1px solid var(--stroke); }
  .comments-list{ flex:1; overflow-y:auto; padding:10px 16px; }
  .comment-row{ display:flex; gap:10px; margin-bottom:14px; }
  .comment-row .avatar{ width:30px;height:30px;border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:12px; color:#0A0A10;}
  .comment-row .txt{ font-size:13.5px; line-height:1.4; }
  .comment-row .txt b{ margin-right:6px; }
  .comment-input-row{ display:flex; gap:8px; padding:10px 14px calc(env(safe-area-inset-bottom,10px) + 10px); border-top:1px solid var(--stroke); }
  .comment-input-row input{
    flex:1; background:var(--glass); border:1px solid var(--stroke); border-radius:18px;
    padding:9px 14px; color:var(--text); font-size:13.5px; font-family:'Inter';
  }
  .comment-input-row button{ background:none; border:none; color:var(--cyan); font-weight:700; font-family:'Space Grotesk'; font-size:13px; cursor:pointer; }

  .menu-sheet{
    position:absolute; left:0; right:0; bottom:0;
    background:rgba(15,14,22,0.95); backdrop-filter:blur(24px);
    border-radius:26px 26px 0 0; border:1px solid var(--stroke); border-bottom:none;
    transform:translateY(105%); transition:transform 0.28s ease; z-index:57;
    padding-bottom:calc(env(safe-area-inset-bottom,10px) + 10px);
  }
  .menu-sheet.active{ transform:translateY(0); }
  .menu-item{ display:flex; align-items:center; gap:12px; padding:15px 22px; font-size:14px; font-weight:600; font-family:'Inter'; cursor:pointer; color:var(--text); }
  .menu-item svg{ width:19px;height:19px; }
  .menu-item.danger{ color:var(--danger); }
  .menu-item + .menu-item{ border-top:1px solid var(--stroke); }

  /* full post viewer (lightbox) */
  .viewer-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0.85); display:none; z-index:55; overflow-y:auto; }
  .viewer-backdrop.active{ display:block; }
  .viewer-close{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); right:16px; z-index:2; width:36px;height:36px;border-radius:50%; background:rgba(255,255,255,0.12); border:1px solid var(--stroke); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .viewer-inner{ padding-top:calc(env(safe-area-inset-top,0px) + 60px); }

  .toast{
    position:absolute; bottom:105px; left:50%; transform:translateX(-50%);
    background:rgba(15,14,22,0.9); backdrop-filter:blur(14px); border:1px solid var(--stroke); padding:9px 18px; border-radius:20px;
    font-size:12.5px; opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:60;
  }
  .toast.show{ opacity:1; }

  .upload-progress{ position:absolute; inset:0; background:rgba(7,7,12,0.75); display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px; z-index:70; backdrop-filter:blur(6px); }
  .upload-progress.show{ display:flex; }
  .spinner{ width:38px;height:38px; border-radius:50%; border:3px solid var(--stroke); border-top-color:var(--cyan); animation:spin 0.8s linear infinite; }
  .upload-progress span{ font-size:12.5px; color:var(--muted); }

  /* ========== AUTH SCREEN ========== */
  .auth-screen{
    position:absolute; inset:0; z-index:100;
    background:linear-gradient(165deg, #0B0B14 0%, #07070C 50%, #0A0612 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 22px; padding-top:calc(env(safe-area-inset-top,0px) + 24px);
    overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  .auth-screen.hidden{ display:none; }
  .auth-logo{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:42px; letter-spacing:1px;
    background:linear-gradient(100deg, var(--cyan), var(--violet), var(--magenta), var(--lime), var(--cyan));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hueflow 6s linear infinite; margin-bottom:6px;
  }
  .auth-tagline{ font-size:13px; color:var(--muted); margin-bottom:28px; text-align:center; }
  .auth-card{
    width:100%; max-width:340px;
    background:var(--glass); border:1px solid var(--stroke); border-radius:28px;
    padding:22px 20px 18px; backdrop-filter:blur(20px);
    box-shadow:0 24px 60px -20px rgba(0,0,0,0.7);
  }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:18px; background:rgba(0,0,0,0.25); border-radius:16px; padding:4px; }
  .auth-tab{
    flex:1; text-align:center; padding:10px; border-radius:12px; border:none; cursor:pointer;
    font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; color:var(--muted); background:transparent;
  }
  .auth-tab.active{ color:var(--text); background:var(--glass-2); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.12); }
  .auth-field{ margin-bottom:12px; }
  .auth-field label{ display:block; font-size:11.5px; color:var(--muted); margin-bottom:5px; font-weight:500; letter-spacing:0.3px; }
  .auth-field input{
    width:100%; background:rgba(0,0,0,0.35); border:1px solid var(--stroke); border-radius:14px;
    padding:12px 14px; color:var(--text); font-size:14.5px; font-family:'Inter'; outline:none;
    transition:border-color 0.2s;
  }
  .auth-field input:focus{ border-color:rgba(77,232,255,0.45); }
  .auth-field input::placeholder{ color:rgba(141,137,166,0.7); }
  .auth-error{
    display:none; background:rgba(255,92,108,0.12); border:1px solid rgba(255,92,108,0.35);
    color:var(--danger); font-size:12.5px; padding:10px 12px; border-radius:12px; margin-bottom:12px; line-height:1.35;
  }
  .auth-error.show{ display:block; }
  .auth-btn{
    width:100%; border:none; padding:13px; border-radius:16px; cursor:pointer;
    font-family:'Space Grotesk'; font-weight:700; font-size:14.5px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta), var(--lime));
    background-size:200% auto; animation:hueflow 5s linear infinite;
    margin-top:4px; transition:opacity 0.2s, transform 0.15s;
  }
  .auth-btn:disabled{ opacity:0.55; cursor:not-allowed; }
  .auth-btn:active{ transform:scale(0.98); }
  .auth-divider{
    display:flex; align-items:center; gap:12px; margin:16px 0 14px; color:var(--muted); font-size:12px;
  }
  .auth-divider::before, .auth-divider::after{
    content:''; flex:1; height:1px; background:var(--stroke);
  }
  .auth-google{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    background:var(--glass-2); border:1px solid var(--stroke); border-radius:16px;
    padding:12px; color:var(--text); font-family:'Space Grotesk'; font-weight:600; font-size:13.5px;
    cursor:pointer; transition:background 0.2s;
  }
  .auth-google:hover{ background:rgba(255,255,255,0.12); }
  .auth-google svg{ width:18px; height:18px; }
  .auth-hint{ text-align:center; font-size:12px; color:var(--muted); margin-top:16px; line-height:1.4; }
  .auth-hint button{ background:none; border:none; color:var(--cyan); font-weight:600; cursor:pointer; font-size:12px; }
  .auth-loading{
    position:absolute; inset:0; background:rgba(7,7,12,0.7); display:none; align-items:center; justify-content:center;
    border-radius:28px; z-index:2;
  }
  .auth-loading.show{ display:flex; }
  .profile-edit-btn{
    margin:0 20px 12px; width:calc(100% - 40px); border:1px solid var(--stroke); background:var(--glass);
    color:var(--text); border-radius:14px; padding:10px; font-family:'Space Grotesk'; font-weight:600; font-size:13px; cursor:pointer;
  }


  .profile-avatar img, #editAvatarPreview img{ width:100%;height:100%;object-fit:cover;border-radius:50%; }
  .profile-avatar{ overflow:hidden; }
  #editProfileBackdrop{ display:none; position:absolute; inset:0; background:rgba(0,0,0,0.65); z-index:80; }
  #editProfileBackdrop.active{ display:block; }
  .follow-btn{
    margin:0 20px 10px; width:calc(100% - 40px); border:none; border-radius:14px; padding:10px;
    font-family:'Space Grotesk'; font-weight:600; font-size:13px; cursor:pointer;
    background:linear-gradient(120deg, var(--cyan), var(--magenta)); color:#0A0A10;
  }
  .follow-btn.following{ background:var(--glass-2); color:var(--text); border:1px solid var(--stroke); }
  .story.seen .ring-spin{ animation:none; background:var(--glass-2); }

</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<div class="phone" id="phone">

  <!-- AUTH SCREEN -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-logo">VIBE</div>

    <div class="auth-card" style="position:relative;">
      <div class="auth-loading" id="authLoading"><div class="spinner"></div></div>
      <div class="auth-tabs">

        <div class="auth-field">
          <label>E-mail</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label>Senha</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">

        <button class="auth-btn" id="btnLogin">Entrar</button>

          <label>Nome de usuário</label>

        </div>
        <div class="auth-field">
          <label>E-mail</label>
          <input type="email" id="regEmail" placeholder="seu@email.com" autocomplete="email">
        </div>
        <div class="auth-field">
          <label>Senha (mín. 6 caracteres)</label>

        <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.5-5.1 3.5-3.1 0-5.6-2.5-5.6-5.6S8.9 6.1 12 6.1c1.8 0 3 .7 3.7 1.4l2.5-2.5C16.7 3.6 14.5 2.7 12 2.7 6.9 2.7 2.7 6.9 2.7 12S6.9 21.3 12 21.3c5.5 0 9.1-3.9 9.1-9.3 0-.6-.1-1.1-.2-1.6H12z"/><path fill="#4285F4" d="M12 10.2v3.6h5.1c-.2 1.2-1.5 3.5-5.1 3.5-3.1 0-5.6-2.5-5.6-5.6"/><path fill="#FBBC05" d="M6.9 14.3l-2.8 2.2C5.6 19 8.6 21.3 12 21.3c2.4 0 4.5-.8 6-2.2l-2.9-2.3c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8z"/><path fill="#34A853" d="M12 6.1c1.3 0 2.5.5 3.4 1.3l2.5-2.5C16.5 3.5 14.4 2.7 12 2.7 8.6 2.7 5.6 4.9 4.1 8l2.8 2.2C7.6 7.7 9.6 6.1 12 6.1z"/></svg>
        Continuar com Google
      </button>
      <div class="auth-hint" id="authHint">Novo por aqui? <button type="button" id="switchToRegister">Criar uma conta</button></div>
    </div>
  </div>
  <div class="grain"></div>

  <div class="statusbar">

      <svg width="18" height="11" viewBox="0 0 18 11" fill="none"><rect x="0.5" y="0.5" width="15" height="10" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="12" height="7" rx="1.3" fill="currentColor"/><rect x="16" y="3.5" width="1.5" height="4" rx="0.7" fill="currentColor"/></svg>
    </div>
  </div>

    'linear-gradient(135deg,#C6FF5C,#4DE8FF)',

    const s = Math.floor((Date.now()-d.getTime())/1000);
    if(s<60) return 'AGORA';
    if(s<3600) return Math.floor(s/60)+'MIN';
    if(s<86400) return Math.floor(s/3600)+'H';

  // ---------- Auth (login / cadastro / Google) ----------
  const googleProvider = new GoogleAuthProvider();

  function showAuthError(msg){
    const el = document.getElementById('authError');

  function setAuthLoading(on){
    document.getElementById('authLoading').classList.toggle('show', on);

  function showAuthScreen(show){
    document.getElementById('authScreen').classList.toggle('hidden', !show);
  }
  function switchAuthTab(mode){
    const isLogin = mode === 'login';
    document.getElementById('tabLogin').classList.toggle('active', isLogin);
    document.getElementById('tabRegister').classList.toggle('active', !isLogin);
    document.getElementById('authFormLogin').style.display = isLogin ? 'block' : 'none';
    document.getElementById('authFormRegister').style.display = isLogin ? 'none' : 'block';
    document.getElementById('authHint').innerHTML = isLogin
      ? 'Novo por aqui? <button type="button" id="switchToRegister">Criar uma conta</button>'
      : 'Já tem conta? <button type="button" id="switchToLogin">Entrar</button>';
    document.getElementById(isLogin ? 'switchToRegister' : 'switchToLogin')?.addEventListener('click', ()=> switchAuthTab(isLogin ? 'register' : 'login'));
    showAuthError('');
  }

  function normalizeUsername(u){
    return (u||'').toLowerCase().replace(/[^a-z0-9._]/g,'').slice(0,24);
  }

  async function isUsernameTaken(username){
    const snap = await getDoc(doc(db,'usernames', username));
    return snap.exists();
  }

  async function saveUserProfile(user, extra={}){
    const username = extra.username || user.displayName || ('user_'+user.uid.slice(0,6));
    const data = {
      uid: user.uid,
      username,
      displayName: extra.displayName || username,
      email: user.email || '',
      photoURL: user.photoURL || '',
      bio: extra.bio || '',
      updatedAt: serverTimestamp()
    };
    if(extra.isNew) data.createdAt = serverTimestamp();
    await setDoc(doc(db,'users', user.uid), data, {merge:true});
    // reserva o username (garante unicidade)
    await setDoc(doc(db,'usernames', username), { uid: user.uid }, {merge:true});
    return data;
  }

  async function loadUserProfile(uid){
    const snap = await getDoc(doc(db,'users', uid));
    return snap.exists() ? snap.data() : null;
  }

  async function setCurrentFromUser(user){
    let profile = await loadUserProfile(user.uid);
    if(!profile){
      // Google first login — cria perfil com nome do Google
      const base = normalizeUsername(user.displayName || user.email?.split('@')[0] || 'vibe') || 'vibe';
      let username = base;
      let n = 0;
      while(await isUsernameTaken(username)){ n++; username = base + n; }
      try{ await updateProfile(user, {displayName: username}); }catch(e){}
      profile = await saveUserProfile(user, {username, displayName: user.displayName || username, isNew:true});
    }
    currentUser = {
      uid: user.uid,
      displayName: profile.username || profile.displayName || user.displayName || 'user',
      username: profile.username || profile.displayName,
      email: profile.email || user.email || '',
      bio: profile.bio || '',
      photoURL: profile.photoURL || user.photoURL || ''
    };
    updateProfileUI();
    showAuthScreen(false);
    startFeedListener();
    startStoriesListener();
    startNotifsListener();
    await loadFollowStats();
    await loadSeenStories();
    renderAll();
  }

  function ensureAuth(){
    return new Promise((resolve)=>{
      let resolved = false;
      onAuthStateChanged(auth, async (user)=>{
        if(user && !user.isAnonymous){
          try{
            await setCurrentFromUser(user);
          }catch(e){
            console.error(e);
            showAuthError('Erro ao carregar perfil.');
          }
          if(!resolved){ resolved = true; resolve(currentUser); }
        } else {
          currentUser = null;
          showAuthScreen(true);
          if(!resolved){ resolved = true; resolve(null); }
        }
      });
    });
  }

  async function doLogin(){
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPassword').value;
    if(!email || !pass){ showAuthError('Preencha e-mail e senha.'); return; }
    setAuthLoading(true); showAuthError('');
    try{
      await signInWithEmailAndPassword(auth, email, pass);
      // onAuthStateChanged cuida do resto
    }catch(err){
      const map = {
        'auth/invalid-email': 'E-mail inválido.',
        'auth/user-not-found': 'Conta não encontrada.',
        'auth/wrong-password': 'Senha incorreta.',
        'auth/invalid-credential': 'E-mail ou senha incorretos.',
        'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco.'
      };
      showAuthError(map[err.code] || 'Não foi possível entrar. Tente de novo.');
    } finally { setAuthLoading(false); }
  }

  async function doRegister(){
    let username = normalizeUsername(document.getElementById('regUsername').value);
    const email = document.getElementById('regEmail').value.trim();
    const pass = document.getElementById('regPassword').value;
    if(!username || username.length < 3){ showAuthError('Nome de usuário: mínimo 3 caracteres (a-z, 0-9, . _).'); return; }
    if(!email || !pass){ showAuthError('Preencha todos os campos.'); return; }
    if(pass.length < 6){ showAuthError('Senha precisa ter pelo menos 6 caracteres.'); return; }
    setAuthLoading(true); showAuthError('');
    try{
      if(await isUsernameTaken(username)){
        showAuthError('Esse nome de usuário já está em uso.');
        setAuthLoading(false);
        return;
      }
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      await updateProfile(cred.user, {displayName: username});
      await saveUserProfile(cred.user, {username, displayName: username, isNew:true});
      // onAuthStateChanged
    }catch(err){
      const map = {
        'auth/email-already-in-use': 'Este e-mail já está cadastrado. Tente entrar.',
        'auth/invalid-email': 'E-mail inválido.',
        'auth/weak-password': 'Senha muito fraca (mín. 6 caracteres).'
      };
      showAuthError(map[err.code] || 'Não foi possível criar a conta.');
    } finally { setAuthLoading(false); }
  }

  async function doLogout(){

  // ---------- Feed em tempo real ----------
  function startFeedListener(){

  // ---------- Compressão de mídia (base64 no Firestore — plano gratuito) ----------
  // Firestore tem limite de ~1MB por documento. Comprimimos bastante as fotos.
  function blobToDataURL(blob){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  async function compressImage(blob, maxW=720, quality=0.55){
    // Se já for dataURL pequena, retorna direto
    const dataUrl = await blobToDataURL(blob);
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        // tenta qualidade progressiva se ficar grande
        let q = quality;
        let out = canvas.toDataURL('image/jpeg', q);
        while(out.length > 700000 && q > 0.25){ // ~525KB base64
          q -= 0.08;
          out = canvas.toDataURL('image/jpeg', q);
        }
        resolve(out);
      };
      img.onerror = ()=> resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  async function prepareMedia(blob, mediaType, thumbDataUrl){
    if(mediaType === 'video'){
      // Vídeos completos são grandes demais para Firestore sem Storage.
      // Salvamos só o thumbnail (foto) + marca como vídeo para a UI.
      if(thumbDataUrl){
        // re-comprime o thumb
        const res = await fetch(thumbDataUrl);
        const tBlob = await res.blob();
        const thumb = await compressImage(tBlob, 480, 0.5);
        return { mediaUrl: thumb, thumbUrl: thumb, mediaType: 'image', note: 'video_thumb' };
      }
      throw new Error('Vídeo não suportado nesta versão gratuita. Publique uma foto.');
    }
    // imagem
    const mediaUrl = await compressImage(blob, 720, 0.55);
    if(mediaUrl.length > 900000){
      throw new Error('Foto muito grande mesmo após compressão. Tente outra.');
    }
    return { mediaUrl, thumbUrl: mediaUrl, mediaType: 'image' };
  }

  // ---------- Criar post ----------
  async function createPost({caption, loc, mediaType, blob, thumbDataUrl}){
    if(!currentUser) throw new Error('Não autenticado');
    const prepared = await prepareMedia(blob, mediaType, thumbDataUrl);
    await addDoc(collection(db,'posts'), {
      userId: currentUser.uid,
      user: currentUser.displayName,
      userPhoto: currentUser.photoURL || '',

      mediaType: prepared.mediaType,

      caption: caption || 'novo momento capturado ✨',
      likes: 0,
      likedBy: [],

      createdAt: serverTimestamp()

        toUserId,
        fromUserId: currentUser.uid,

        text,
        postId: postId || null,
        thumb: thumb || null,
        read: false,
        createdAt: serverTimestamp()

    }catch(e){ console.warn('notif', e); }
  }

  async function toggleLike(postId){
    if(!currentUser) return;
    const p = posts.find(x=>x.id===postId);
    if(!p) return;
    const refPost = doc(db,'posts',postId);
    if(p.liked){
      await updateDoc(refPost, {
        likes: Math.max(0,(p.likes||1)-1),
        likedBy: arrayRemove(currentUser.uid)
      });
    } else {
      await updateDoc(refPost, {
        likes: (p.likes||0)+1,
        likedBy: arrayUnion(currentUser.uid)
      });
      await createNotification({
        toUserId: p.userId,
        type: 'like',
        text: 'curtiu sua publicação',
        postId: p.id,
        thumb: p.thumbUrl || p.mediaUrl
      });
    }
  }

  // ---------- Comentário ----------
  async function addComment(postId, text){
    if(!currentUser || !text.trim()) return;
    const p = posts.find(x=>x.id===postId);
    const refPost = doc(db,'posts',postId);
    await updateDoc(refPost, {
      comments: arrayUnion({
        user: currentUser.displayName,
        userId: currentUser.uid,
        userPhoto: currentUser.photoURL || '',
        text: text.trim(),
        at: Date.now()
      })
    });
    if(p){
      await createNotification({
        toUserId: p.userId,
        type: 'comment',
        text: 'comentou: "' + text.trim().slice(0,40) + (text.trim().length>40?'...':'') + '"',
        postId: p.id,
        thumb: p.thumbUrl || p.mediaUrl
      });
    }
  }

  // ---------- Follow ----------
  async function loadFollowStats(){
    if(!currentUser) return;
    try{
      const followingSnap = await getDocs(collection(db,'users', currentUser.uid, 'following'));
      followingIds = new Set(followingSnap.docs.map(d=>d.id));
      followingCount = followingIds.size;
      const followersSnap = await getDocs(collection(db,'users', currentUser.uid, 'followers'));
      followersCount = followersSnap.size;
      document.getElementById('followersCount').textContent = followersCount;
      document.getElementById('followingCount').textContent = followingCount;
    }catch(e){ console.warn('follow stats', e); }
  }

  async function toggleFollow(targetUserId, targetUsername){
    if(!currentUser || targetUserId === currentUser.uid) return;
    const isFollowing = followingIds.has(targetUserId);
    const myFollowing = doc(db,'users', currentUser.uid, 'following', targetUserId);
    const theirFollowers = doc(db,'users', targetUserId, 'followers', currentUser.uid);
    if(isFollowing){
      await deleteDoc(myFollowing);
      await deleteDoc(theirFollowers);
      followingIds.delete(targetUserId);
      followingCount = Math.max(0, followingCount-1);
    } else {
      await setDoc(myFollowing, { username: targetUsername, at: serverTimestamp() });
      await setDoc(theirFollowers, { username: currentUser.displayName, at: serverTimestamp() });
      followingIds.add(targetUserId);
      followingCount++;
      await createNotification({
        toUserId: targetUserId,
        type: 'follow',
        text: 'começou a seguir você'
      });
    }
    document.getElementById('followingCount').textContent = followingCount;
    renderProfile();
  }

  // ---------- Stories ----------
  function startStoriesListener(){
    if(unsubStories) unsubStories();
    const since = new Date(Date.now() - 24*60*60*1000);
    const q = query(collection(db,'stories'), orderBy('createdAt','desc'), limit(40));
    unsubStories = onSnapshot(q, (snap)=>{
      const now = Date.now();
      liveStories = snap.docs.map(d=>{
        const data = d.data();
        const created = data.createdAt?.toDate ? data.createdAt.toDate().getTime() : (data.createdAt || 0);
        return {
          id: d.id,
          userId: data.userId,
          user: data.user,
          img: data.mediaUrl,
          userPhoto: data.userPhoto || '',
          createdAt: created
        };
      }).filter(s => s.createdAt > now - 24*60*60*1000);
      renderStories();
    }, err => console.warn('stories', err));
  }

  async function ensureUserPhoto(uid){
    if(!uid) return null;
    if(userCache[uid]?.photoURL !== undefined) return userCache[uid].photoURL;
    try{
      const snap = await getDoc(doc(db,'users', uid));
      if(snap.exists()){
        const d = snap.data();
        userCache[uid] = { username: d.username || d.displayName, photoURL: d.photoURL || '' };
        return userCache[uid].photoURL;
      }
    }catch(e){}
    userCache[uid] = { photoURL: '' };
    return '';
  }

  function avatarHtml(name, photoUrl){
    if(photoUrl){
      return `<img src="${photoUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    }
    return initials(name);
  }

  // ---------- Notifications listener ----------
  function startNotifsListener(){
    if(unsubNotifs) unsubNotifs();
    if(!currentUser) return;
    // só where (sem orderBy) para não exigir índice composto no Firestore
    const q = query(
      collection(db,'notifications'),
      where('toUserId','==', currentUser.uid),
      limit(50)
    );
    unsubNotifs = onSnapshot(q, (snap)=>{
      notifications = snap.docs.map(d=>{
        const data = d.data();
        return {
          id: d.id,
          ...data,
          time: timeAgo(data.createdAt),
          _ts: data.createdAt?.toMillis ? data.createdAt.toMillis() : 0
        };
      }).sort((a,b)=> b._ts - a._ts);
      const hasUnread = notifications.some(n => !n.read);
      hasUnseenActivity = hasUnread;
      document.getElementById('activityBadge').classList.toggle('show', hasUnread);
      document.getElementById('navActivityDot').classList.toggle('show', hasUnread);
      if(document.getElementById('view-activity').classList.contains('active')){
        renderActivity();
      }
    }, err => {
      console.warn('notifs listener', err);
      // se faltar índice, ainda funciona sem orderBy complexo — fallback silencioso
    });
  }

  async function markNotifsRead(){
    const unread = notifications.filter(n => !n.read);
    for(const n of unread){
      try{ await updateDoc(doc(db,'notifications', n.id), { read: true }); }catch(e){}
    }
  }

  function openEditProfile(){
    if(!currentUser) return;
    pendingProfilePhoto = null;
    document.getElementById('editUsername').value = currentUser.username || currentUser.displayName || '';
    document.getElementById('editBio').value = currentUser.bio || '';
    const prev = document.getElementById('editAvatarPreview');
    if(currentUser.photoURL){

    } else {

  function closeEditProfile(){
    document.getElementById('editProfileBackdrop').classList.remove('active');
  }
  async function saveProfile(){
    if(!currentUser) return;
    let username = normalizeUsername(document.getElementById('editUsername').value);
    const bio = document.getElementById('editBio').value.trim().slice(0,150);
    const errEl = document.getElementById('editProfileError');
    if(!username || username.length < 3){
      errEl.textContent = 'Usuário inválido (mín. 3 caracteres)';
      errEl.classList.add('show');
      return;
    }
    try{
      const oldUsername = currentUser.username || currentUser.displayName;
      if(username !== oldUsername){
        if(await isUsernameTaken(username)){
          errEl.textContent = 'Esse nome de usuário já está em uso';
          errEl.classList.add('show');
          return;
        }
        // libera antigo e reserva novo
        try{ await deleteDoc(doc(db,'usernames', oldUsername)); }catch(e){}
        await setDoc(doc(db,'usernames', username), { uid: currentUser.uid });
      }
      const updates = { username, displayName: username, bio, updatedAt: serverTimestamp() };
      if(pendingProfilePhoto){
        updates.photoURL = pendingProfilePhoto;
      }
      await setDoc(doc(db,'users', currentUser.uid), updates, {merge:true});
      try{ await updateProfile(auth.currentUser, { displayName: username }); }catch(e){}
      currentUser.username = username;
      currentUser.displayName = username;
      currentUser.bio = bio;
      if(pendingProfilePhoto) currentUser.photoURL = pendingProfilePhoto;
      updateProfileUI();
      closeEditProfile();
      showToast('Perfil atualizado!');
      renderProfile();
    }catch(e){
      console.error(e);
      errEl.textContent = 'Erro ao salvar. Tente de novo.';
      errEl.classList.add('show');
    }
  }

  async function loadSeenStories(){

    try{
      const snap = await getDocs(collection(db,'users', currentUser.uid, 'seenStories'));
      seenStoryIds = new Set(snap.docs.map(d=>d.id));
    }catch(e){
      try{
        const local = JSON.parse(localStorage.getItem('vibe-seen-stories')||'[]');
        seenStoryIds = new Set(local);
      }catch(e2){ seenStoryIds = new Set(); }

    if(!currentUser || !storyId || seenStoryIds.has(storyId)) return;
    seenStoryIds.add(storyId);
    try{
      await setDoc(doc(db,'users', currentUser.uid, 'seenStories', storyId), {
        at: serverTimestamp()
      });
    }catch(e){}
    try{
      localStorage.setItem('vibe-seen-stories', JSON.stringify([...seenStoryIds].slice(-200)));

  function renderStories(){
    const row = document.getElementById('storiesRow');
    row.innerHTML = '';
    // Seu story (sempre; pode postar quantos quiser)
    const you = document.createElement('div');
    you.className = 'story';
    const myPhoto = currentUser?.photoURL
      ? `<img src="${currentUser.photoURL}" alt="">`
      : initials(currentUser?.displayName||'Y');
    const myBg = currentUser?.photoURL ? 'transparent' : gradFor(currentUser?.displayName||'voce');
    // se você tem stories não vistos próprios, anel ativo; senão só o +
    const myUnseen = liveStories.some(s => s.userId === currentUser?.uid && !seenStoryIds.has(s.id));
    you.innerHTML = `<div class="ring-spin you-add ${myUnseen?'':'seen'}"><div class="avatar" style="background:${myBg};">${myPhoto}<div class="plus-badge">+</div></div></div><span>Seu story</span>`;
    you.onclick = ()=> document.getElementById('storyFileInput').click();
    // long-press or second action: if has own unseen, could open - for now + always adds
    // double-tap own ring to view own sequence? keep simple: + = new story
    row.appendChild(you);

    // Só de quem você SEGUE + ainda tem story não visto (sequência por usuário)
    const byUser = {};
    liveStories.forEach(s=>{
      if(currentUser && s.userId === currentUser.uid) return;
      if(!followingIds.has(s.userId)) return; // só seguindo
      if(seenStoryIds.has(s.id)) return;
      if(!byUser[s.userId]) byUser[s.userId] = [];
      byUser[s.userId].push(s);
    });
    Object.keys(byUser).forEach(uid=>{
      const list = byUser[uid].sort((a,b)=>a.createdAt-b.createdAt);
      const s = list[0]; // mostra anel; ao abrir roda a sequência completa
      const el = document.createElement('div');
      el.className = 'story';
      const av = s.userPhoto
        ? `<img src="${s.userPhoto}" alt="">`
        : initials(s.user);
      const bg = s.userPhoto ? 'transparent' : gradFor(s.user);
      const count = list.length > 1 ? `<span style="position:absolute;bottom:-2px;right:-2px;background:var(--magenta);color:#fff;font-size:9px;font-weight:700;border-radius:8px;padding:1px 4px;border:2px solid #0B0B14;">${list.length}</span>` : '';
      el.innerHTML = `<div class="ring-spin" style="position:relative;"><div class="avatar" style="background:${bg};">${av}</div>${count}</div><span>${(s.user||'').split(/[._]/)[0].slice(0,8)}</span>`;
      el.onclick = ()=> openStory(s);
      row.appendChild(el);
    });
  }

  function renderFeed(){
    const list = document.getElementById('feedList');
    list.innerHTML = '';
    if(posts.length === 0){
      list.innerHTML = `<div class="empty-state">Nenhuma publicacao ainda<br><button id="feedEmptyCamBtn">Compartilhar o primeiro momento</button></div>`;
      document.getElementById('feedEmptyCamBtn').onclick = openCamera;
      return;
    }
    posts.forEach(p => list.appendChild(postCard(p)));
    // carrega fotos de perfil que faltam nos posts antigos
    (async ()=>{
      for(const p of posts){
        if(p.userPhoto || !p.userId) continue;
        const photo = await ensureUserPhoto(p.userId);
        if(photo){
          p.userPhoto = photo;
          const av = list.querySelector(`.avatar[data-uid="${p.userId}"]`);
          if(av){
            av.style.background = 'transparent';
            av.innerHTML = `<img src="${photo}" alt="">`;
          }
        }
      }
    })();
  }

  function normalize(str){ return (str||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

  async function gridCell(p){

    cell.className = 'cell';

    cell.innerHTML = thumb ? `<img src="${thumb}" alt="">` : '';

      cell.appendChild(tag);
    }
    cell.onclick = ()=> openPostViewer(p);
    return cell;

  async function renderSearch(query){
    const grid = document.getElementById('searchGrid');
    const emptyEl = document.getElementById('searchEmpty');
    grid.innerHTML = '';
    const q = normalize(query||'');
    const filtered = q ? posts.filter(p=> normalize(p.user).includes(q) || normalize(p.caption).includes(q) || normalize(p.loc).includes(q)) : posts;
    emptyEl.style.display = filtered.length ? 'none' : 'block';
    for(const p of filtered) grid.appendChild(await gridCell(p));
  }

  function renderActivity(){
    const list = document.getElementById('activityList');
    list.innerHTML = '';
    if(!notifications.length){
      list.innerHTML = '<div class="empty-state" style="padding:40px 20px;">Nenhuma notificação ainda</div>';
    } else {
      notifications.forEach(a=>{
        const row = document.createElement('div');
        row.className = 'activity-item';
        const thumb = a.thumb ? `<img class="thumb" src="${a.thumb}">` : '';
        const photo = a.fromPhoto || '';
        const avInner = photo
          ? `<img src="${photo}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`
          : initials(a.fromUser);
        const avBg = photo ? 'transparent' : gradFor(a.fromUser);
        row.innerHTML = `
          <div class="avatar" style="background:${avBg};cursor:pointer;" data-uid="${a.fromUserId||''}">${avInner}</div>
          <div class="txt"><span class="u" style="cursor:pointer;color:var(--text);" data-uid="${a.fromUserId||''}">${a.fromUser||'alguém'}</span> ${a.text||''} <div class="time">${a.time||''}</div></div>
          ${thumb}
        `;
        list.appendChild(row);
        if(!photo && a.fromUserId){

      const data = snap.data();
      viewingProfile = {

        bio: data.bio || '',

    const targetName = isOther ? viewingProfile.username : (currentUser.username || currentUser.displayName);

    document.getElementById('profileBackBtn').style.display = isOther ? 'block' : 'none';

    const followBtn = document.getElementById('profileFollowBtn');
    if(isOther){
      followBtn.style.display = 'block';
      const isF = followingIds.has(targetUid);
      followBtn.textContent = isF ? 'Seguindo' : 'Seguir';
      followBtn.classList.toggle('following', isF);
      followBtn.onclick = async ()=>{
        await toggleFollow(targetUid, targetName);
        const nowF = followingIds.has(targetUid);
        followBtn.textContent = nowF ? 'Seguindo' : 'Seguir';

    const userPosts = posts.filter(p=>p.userId === targetUid);

    const wrap = document.getElementById('myGridWrap');

  // ---------- Stories (sequência + pause + visualização única) ----------
  var storyTimer = null;
  var storyRemainingMs = 4000;
  var storySegmentStarted = 0;
  var storyList = [];
  var storyIdx = 0;
  var storyBars = null;
  // storyPaused já declarado no estado global

  function clearStoryTimer(){
    if(storyTimer){ clearTimeout(storyTimer); storyTimer = null; }
  }

  function openStory(s){
    clearStoryTimer();
    storyPaused = false;
    storyRemainingMs = 4000;

    // sequência: todos os stories NÃO vistos deste usuário (quem você segue)
    storyList = liveStories
      .filter(x => x.userId === s.userId && !seenStoryIds.has(x.id))
      .sort((a,b) => a.createdAt - b.createdAt);
    if(!storyList.length){
      if(!seenStoryIds.has(s.id)) storyList = [s];
    }
    if(!storyList.length){
      showToast('Story já visualizado');
      renderStories();
      return;
    }
    storyIdx = Math.max(0, storyList.findIndex(x => x.id === s.id));
    if(storyIdx < 0) storyIdx = 0;

    const av = document.getElementById('storyAvatar');
    av.style.background = s.userPhoto ? 'transparent' : gradFor(s.user);
    if(s.userPhoto){
      av.innerHTML = `<img src="${s.userPhoto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    } else {
      av.textContent = initials(s.user);
    }
    document.getElementById('storyUname').textContent = s.user;

    const prog = document.getElementById('storyProgress');
    prog.innerHTML = storyList.map(() => '<div class="bar"><i></i></div>').join('');
    storyBars = prog.querySelectorAll('.bar');

    document.getElementById('storyView').classList.add('active');
    playStorySegment(storyIdx);
  }

  function playStorySegment(i){
    storyIdx = i;
    storyPaused = false;
    storyRemainingMs = 4000;
    storySegmentStarted = Date.now();
    clearStoryTimer();

    const item = storyList[i];
    if(!item){ closeStory(); return; }

    document.getElementById('storyImg').src = item.img;
    markStorySeen(item.id);

    storyBars.forEach((b, bi) => {
      const fill = b.querySelector('i');
      b.classList.remove('playing', 'done');
      if(fill){
        fill.style.animation = 'none';
        fill.style.transition = 'none';
        fill.style.width = bi < i ? '100%' : '0%';
      }
      if(bi < i) b.classList.add('done');
    });

    const cur = storyBars[i];
    const fill = cur?.querySelector('i');
    if(cur) cur.classList.add('playing');
    if(fill){
      void fill.offsetWidth;
      fill.style.transition = 'width 4s linear';
      fill.style.width = '100%';
    }

    storyTimer = setTimeout(() => advanceStory(), 4000);
  }

  function advanceStory(){
    if(storyPaused) return;
    const fill = storyBars[storyIdx]?.querySelector('i');
    if(fill){ fill.style.transition = 'none'; fill.style.width = '100%'; }
    storyBars[storyIdx]?.classList.remove('playing');
    storyBars[storyIdx]?.classList.add('done');
    if(storyIdx + 1 >= storyList.length){
      closeStory();
      return;
    }
    playStorySegment(storyIdx + 1);
  }

  function toggleStoryPause(e){
    if(e) e.stopPropagation();
    // não pausar se clicou no X
    if(e && (e.target.id === 'closeStoryBtn' || e.target.closest('#closeStoryBtn'))) return;
    if(e && e.target.closest('.story-head .x')) return;

    const fill = storyBars?.[storyIdx]?.querySelector('i');
    if(!storyPaused){
      // PAUSAR
      storyPaused = true;
      clearStoryTimer();
      const elapsed = Date.now() - storySegmentStarted;
      storyRemainingMs = Math.max(200, 4000 - elapsed);
      if(fill){
        const parentW = fill.parentElement.offsetWidth || 1;
        const w = fill.getBoundingClientRect().width;
        const pct = Math.min(100, (w / parentW) * 100);
        fill.style.transition = 'none';
        fill.style.width = pct + '%';
        // recalcula remaining pela % real
        storyRemainingMs = Math.max(200, 4000 * (1 - pct/100));
      }
      // indicador visual leve
      document.getElementById('storyImg').style.filter = 'brightness(0.85)';
    } else {
      // CONTINUAR
      storyPaused = false;
      storySegmentStarted = Date.now() - (4000 - storyRemainingMs);
      if(fill){
        fill.style.transition = `width ${storyRemainingMs}ms linear`;
        fill.style.width = '100%';
      }
      document.getElementById('storyImg').style.filter = '';
      clearStoryTimer();
      storyTimer = setTimeout(() => advanceStory(), storyRemainingMs);
    }
  }

  function closeStory(){
    document.getElementById('storyView').classList.remove('active');
    clearStoryTimer();
    storyPaused = false;
    document.getElementById('storyImg').style.filter = '';
    renderStories();
  }

  // ---------- Câmera ----------
  async function openCamera(){
    document.getElementById('cameraView').classList.add('active');

  function setMode(mode){
    captureMode = mode;
    document.querySelectorAll('#modeSwitch button').forEach(b=> b.classList.toggle('active', b.dataset.mode===mode));
    document.getElementById('cameraHint').textContent = mode==='photo' ? 'Toque no botao para capturar' : 'Toque e segure para gravar';

  document.querySelectorAll('#modeSwitch button').forEach(b=> b.onclick = ()=> setMode(b.dataset.mode));

  async function startStream(){
    stopStream();
    try{
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: captureMode==='video' });
      const video = document.getElementById('video');
      video.srcObject = cameraStream;
      video.style.transform = facingMode==='user' ? 'scaleX(-1)' : 'scaleX(1)';
    }catch(err){
      document.getElementById('cameraHint').textContent = 'Camera indisponivel — use a galeria';
    }
  }
  function stopStream(){
    if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  }
  document.getElementById('closeCameraBtn').onclick = ()=>{
    stopStream();
    document.getElementById('cameraView').classList.remove('active');
  };
  document.getElementById('flipCameraBtn').onclick = ()=>{
    facingMode = facingMode==='user' ? 'environment' : 'user';
    startStream();
  };

  function capturePhotoFromVideo(){
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const targetW = 720;
    const targetH = Math.round(targetW * (video.videoHeight/video.videoWidth || 1.25));
    canvas.width = targetW; canvas.height = targetH;
    const ctx = canvas.getContext('2d');
    ctx.save();
    if(facingMode==='user'){ ctx.translate(targetW,0); ctx.scale(-1,1); }
    ctx.drawImage(video, 0, 0, targetW, targetH);
    ctx.restore();
    canvas.toBlob(blob=>{
      capturedBlob = blob; capturedMediaType = 'image'; capturedThumb = canvas.toDataURL('image/jpeg',0.6);
      openPreview();
    }, 'image/jpeg', 0.8);
  }

  function startRecording(){
    if(!cameraStream || !window.MediaRecorder){ showToast('Gravacao nao suportada'); return; }
    recordedChunks = [];
    let mime = '';
    ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'].some(m=>{
      if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)){ mime = m; return true; }
      return false;
    });
    try{
      mediaRecorder = mime ? new MediaRecorder(cameraStream, {mimeType:mime}) : new MediaRecorder(cameraStream);
    }catch(e){ showToast('Gravacao nao suportada'); return; }
    mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = onRecordingStop;
    mediaRecorder.start();
    document.getElementById('shutterBtn').classList.add('recording');
    document.getElementById('recTimer').classList.add('show');
    recStartedAt = Date.now();
    recTimerInterval = setInterval(()=>{
      const secs = Math.floor((Date.now()-recStartedAt)/1000);
      const m = Math.floor(secs/60), s = secs%60;
      document.getElementById('recTimerText').textContent = m+':'+String(s).padStart(2,'0');
      if(secs >= 15) stopRecording();
    }, 250);
  }
  function stopRecording(){
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    clearInterval(recTimerInterval);
    document.getElementById('shutterBtn').classList.remove('recording');
    document.getElementById('recTimer').classList.remove('show');
  }
  async function onRecordingStop(){
    if(!recordedChunks.length) return;
    const blob = new Blob(recordedChunks, {type: mediaRecorder.mimeType || 'video/webm'});
    capturedBlob = blob;
    capturedMediaType = 'video';
    capturedThumb = await generateVideoThumb(blob);
    openPreview();
  }
  function generateVideoThumb(blob){
    return new Promise(resolve=>{
      const v = document.getElementById('hiddenVideoProcessor');
      const url = URL.createObjectURL(blob);
      v.src = url;
      v.onloadeddata = ()=>{ v.currentTime = Math.min(0.15, (v.duration||1)/4); };
      v.onseeked = ()=>{
        const canvas = document.getElementById('canvas');
        canvas.width = 360; canvas.height = Math.round(360*(v.videoHeight/v.videoWidth||1.25));
        canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',0.6));
        URL.revokeObjectURL(url);
      };
      v.onerror = ()=> resolve(null);
    });
  }

  const shutterBtn = document.getElementById('shutterBtn');
  shutterBtn.addEventListener('pointerdown', (e)=>{
    if(!document.getElementById('video').srcObject){ document.getElementById('fileInput').click(); return; }
    if(captureMode==='video'){
      pressTimer = setTimeout(()=> startRecording(), 180);
    }
  });
  shutterBtn.addEventListener('pointerup', ()=>{
    clearTimeout(pressTimer);
    if(captureMode==='video'){
      if(mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
    } else {
      if(document.getElementById('video').srcObject) capturePhotoFromVideo();
    }
  });
  shutterBtn.addEventListener('pointerleave', ()=>{
    if(mediaRecorder && mediaRecorder.state === 'recording') stopRecording();
  });

  document.getElementById('galleryBtn').onclick = ()=> document.getElementById('fileInput').click();
  document.getElementById('fileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(file.type.startsWith('video/')){
      capturedBlob = file;
      capturedMediaType = 'video';
      capturedThumb = await generateVideoThumb(file);
      openPreview();
    } else {
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          const canvas = document.getElementById('canvas');
          const targetW = 720;
          const targetH = Math.round(targetW * (img.height/img.width));
          canvas.width = targetW; canvas.height = targetH;
          canvas.getContext('2d').drawImage(img,0,0,targetW,targetH);
          canvas.toBlob(blob=>{
            capturedBlob = blob; capturedMediaType = 'image'; capturedThumb = canvas.toDataURL('image/jpeg',0.6);
            openPreview();
          }, 'image/jpeg', 0.8);
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }
    e.target.value = '';
  });

  function openPreview(){
    const wrap = document.getElementById('previewMediaWrap');
    const url = URL.createObjectURL(capturedBlob);
    wrap.innerHTML = capturedMediaType === 'video'
      ? `<video src="${url}" controls playsinline muted autoplay loop></video>`
      : `<img src="${url}" alt="preview">`;
    document.getElementById('captionInput').value = '';
    document.getElementById('locInput').value = '';
    document.getElementById('previewView').classList.add('active');
  }
  document.getElementById('closePreviewBtn').onclick = document.getElementById('discardBtn').onclick = ()=>{
    document.getElementById('previewView').classList.remove('active');
    document.getElementById('previewMediaWrap').innerHTML = '';
    resetPreviewMode();
  };
  document.getElementById('aiSuggestBtn').onclick = ()=>{
    const idea = CAPTION_IDEAS[Math.floor(Math.random()*CAPTION_IDEAS.length)];
    document.getElementById('captionInput').value = idea;
  };

  document.getElementById('shareBtn').onclick = async ()=>{
    const shareBtn = document.getElementById('shareBtn');
    const isStory = document.getElementById('previewView').dataset.mode === 'story';
    shareBtn.disabled = true;
    document.getElementById('uploadProgress').classList.add('show');
    try{
      if(!currentUser) throw new Error('Não autenticado');
      if(isStory){
        if(!pendingStoryBlob) throw new Error('Sem mídia');
        await publishStory(pendingStoryBlob);
        document.getElementById('previewView').classList.remove('active');
        document.getElementById('previewMediaWrap').innerHTML = '';
        resetPreviewMode();
        switchView('feed');
      } else {
        const caption = document.getElementById('captionInput').value.trim() || 'novo momento capturado ✨';
        const loc = document.getElementById('locInput').value.trim() || 'Agora';
        await createPost({ caption, loc, mediaType: capturedMediaType, blob: capturedBlob, thumbDataUrl: capturedThumb });
        document.getElementById('previewView').classList.remove('active');
        document.getElementById('previewMediaWrap').innerHTML = '';
        document.getElementById('cameraView').classList.remove('active');
        stopStream();
        switchView('feed');
        showToast('Publicado para todos!');
      }
    } catch(err){
      console.error(err);
      showToast(isStory ? 'Erro ao publicar story' : 'Erro ao publicar. Verifique Firestore e as regras.');
    } finally {
      shareBtn.disabled = false;
      document.getElementById('uploadProgress').classList.remove('show');
    }
  };

  // ---------- Relógio + PWA ----------
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }
  tick(); setInterval(tick, 30000);

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById('installBtn').classList.add('show');
  });
  document.getElementById('installBtn').onclick = async ()=>{
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    document.getElementById('installBtn').classList.remove('show');
  };
  window.addEventListener('appinstalled', ()=>{
    document.getElementById('installBtn').classList.remove('show');
    showToast('VIBE instalado!');
  });
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }

  // ---------- Init ----------
  document.getElementById('logoutBtn')?.addEventListener('click', doLogout);
  document.getElementById('editProfileBtn')?.addEventListener('click', openEditProfile);
  document.getElementById('closeEditProfile')?.addEventListener('click', closeEditProfile);
  document.getElementById('saveProfileBtn')?.addEventListener('click', saveProfile);
  document.getElementById('changePhotoBtn')?.addEventListener('click', ()=> document.getElementById('profilePhotoInput').click());
  document.getElementById('profilePhotoInput')?.addEventListener('change', async (e)=>{
    const file = e.target.files?.[0];
    if(!file) return;
    pendingProfilePhoto = await compressImage(file, 320, 0.55);
    const prev = document.getElementById('editAvatarPreview');
    prev.innerHTML = `<img src="${pendingProfilePhoto}" alt="">`;
    e.target.value = '';
  });
  document.getElementById('editProfileBackdrop')?.addEventListener('click', (e)=>{
    if(e.target.id==='editProfileBackdrop') closeEditProfile();
  });
  document.getElementById('storyFileInput')?.addEventListener('change', async (e)=>{
    const file = e.target.files?.[0];
    if(!file) return;
    openStoryPreview(file);
    e.target.value = '';
  });

  (async function init(){
    try{
      const saved = JSON.parse(localStorage.getItem('vibe-saved')||'[]');
      mySavedIds = new Set(saved);
    }catch(e){}
    switchAuthTab('login');
    await ensureAuth();
    // se logado, setCurrentFromUser já iniciou o feed
  })();
</script>
</body>
</html>
