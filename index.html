<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VIBE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#07070C">
<meta name="description" content="VIBE — rede social futurista para compartilhar fotos e vídeos.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIBE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07070C;
    --glass:rgba(255,255,255,0.05);
    --glass-2:rgba(255,255,255,0.09);
    --stroke:rgba(255,255,255,0.10);
    --text:#F3F2FA;
    --muted:#8D89A6;
    --cyan:#4DE8FF;
    --magenta:#FF3DBD;
    --violet:#A78BFA;
    --lime:#C6FF5C;
    --danger:#FF5C6C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh; min-height:100dvh;
    background:#020204;
    display:flex; align-items:center; justify-content:center;
    font-family:'Inter',sans-serif; color:var(--text);
    padding:28px 12px; overflow:hidden;
  }
  .bg-blob{ position:fixed; border-radius:50%; filter:blur(90px); opacity:0.55; z-index:0; }
  .bg-blob.b1{ width:420px; height:420px; background:radial-gradient(circle, var(--magenta), transparent 70%); top:-10%; left:-12%; animation:drift1 16s ease-in-out infinite; }
  .bg-blob.b2{ width:460px; height:460px; background:radial-gradient(circle, var(--cyan), transparent 70%); bottom:-14%; right:-10%; animation:drift2 19s ease-in-out infinite; }
  .bg-blob.b3{ width:340px; height:340px; background:radial-gradient(circle, var(--violet), transparent 70%); top:40%; right:20%; animation:drift3 14s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);} }
  @keyframes drift2{ 0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);} }
  @keyframes drift3{ 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(-30px,50px) scale(1.15);} }

  .phone{
    width:390px; max-width:100%; height:832px; max-height:96vh;
    background:linear-gradient(180deg, #0B0B14, #07070C 40%);
    border-radius:46px; border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 0 0 8px #050507, 0 40px 100px -20px rgba(0,0,0,0.85),
      0 0 60px -10px rgba(167,139,250,0.25);
    overflow:hidden; position:relative; display:flex; flex-direction:column; z-index:1;
  }
  /* On real phones (installed PWA / small viewports) drop the mockup chrome and go edge-to-edge */
  @media (max-width:480px), (display-mode:standalone){
    body{ padding:0; overflow:hidden; }
    .bg-blob{ display:none; }
    .phone{
      width:100vw; width:100dvw; height:100vh; height:100dvh; max-height:none;
      border-radius:0; border:none; box-shadow:none;
    }
  }
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:0.05; z-index:5;
    background-image:radial-gradient(rgba(255,255,255,0.9) 0.6px, transparent 0.6px);
    background-size:3px 3px; }

  .statusbar{ display:flex; justify-content:space-between; align-items:center; padding:14px 26px 2px; font-size:13px; font-weight:600; flex-shrink:0; padding-top:calc(env(safe-area-inset-top,0px) + 14px); }
  .statusbar .dot-icons{ display:flex; gap:5px; align-items:center; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 18px 12px; flex-shrink:0; gap:8px; }
  .logo{
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:23px; letter-spacing:0.5px;
    background:linear-gradient(100deg, var(--cyan), var(--violet), var(--magenta), var(--lime), var(--cyan));
    background-size:300% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:hueflow 6s linear infinite;
    position:relative;
  }
  .logo::after{ content:'2027'; position:absolute; top:-2px; right:-30px; font-family:'Inter'; font-size:8px; font-weight:600; letter-spacing:1px; color:var(--muted); background:var(--glass); border:1px solid var(--stroke); padding:2px 4px; border-radius:5px; -webkit-text-fill-color:var(--muted); }
  @keyframes hueflow{ to{ background-position:300% center; } }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .icon-btn{
    width:37px;height:37px;border-radius:50%; display:flex;align-items:center;justify-content:center;
    background:var(--glass); border:1px solid var(--stroke); color:var(--text); cursor:pointer; backdrop-filter:blur(10px); position:relative;
  }
  .icon-btn svg{ width:18px;height:18px; }
  .badge-dot{ position:absolute; top:3px; right:3px; width:8px; height:8px; border-radius:50%; background:var(--magenta); box-shadow:0 0 6px var(--magenta); display:none; }
  .badge-dot.show{ display:block; }
  .install-btn{
    display:none; align-items:center; gap:5px; font-size:11px; font-weight:600; font-family:'Space Grotesk';
    background:var(--glass-2); border:1px solid var(--stroke); color:var(--text); border-radius:14px; padding:7px 10px; cursor:pointer;
  }
  .install-btn.show{ display:inline-flex; }
  .install-btn svg{ width:13px;height:13px; }

  .view{ flex:1; overflow-y:auto; display:none; padding-bottom:110px; position:relative; z-index:1; -webkit-overflow-scrolling:touch; }
  .view.active{ display:block; }
  .view::-webkit-scrollbar{ display:none; }

  /* stories as orbs */
  .stories{ display:flex; gap:15px; padding:4px 18px 18px; overflow-x:auto; }
  .stories::-webkit-scrollbar{ display:none; }
  .story{ flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:64px; }
  .story .ring-spin{
    width:60px;height:60px;border-radius:50%; padding:3px; position:relative;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--violet), var(--cyan));
    animation:spin 5s linear infinite;
  }
  .story.seen .ring-spin{ animation:none; background:var(--glass-2); }
  .story .avatar{
    width:100%;height:100%;border-radius:50%; display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:16px; color:#0A0A10;
    border:3px solid #0B0B14; overflow:hidden;
  }
  .story .avatar img{ width:100%; height:100%; object-fit:cover; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .story .you-add{ position:relative; }
  .story .plus-badge{
    position:absolute; bottom:-1px; right:-1px; width:19px;height:19px;border-radius:50%;
    background:var(--magenta); border:2px solid #0B0B14; display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:700; color:#fff;
  }
  .story span{ font-size:11px; color:var(--muted); }

  /* feed glass cards */
  .post{
    margin:0 14px 16px; border-radius:26px; background:var(--glass);
    border:1px solid var(--stroke); backdrop-filter:blur(18px); overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.6);
  }
  .post-head{ display:flex; align-items:center; gap:10px; padding:14px 14px 10px; }
  .post-head .avatar{ width:34px;height:34px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:13px; color:#0A0A10; flex-shrink:0; overflow:hidden; }
  .post-head .avatar img{ width:100%;height:100%;object-fit:cover; }
  .post-head .who{ flex:1; min-width:0; }
  .post-head .uname{ font-weight:600; font-size:13.5px; display:flex; align-items:center; gap:5px; }
  .post-head .uname .you-tag{ font-size:9.5px; font-weight:700; color:#0A0A10; background:linear-gradient(120deg,var(--cyan),var(--lime)); padding:2px 6px; border-radius:8px; letter-spacing:0.4px; }
  .post-head .loc{ font-size:11.5px; color:var(--muted); }
  .post-img-wrap{ position:relative; width:100%; aspect-ratio:4/5; background:#000; overflow:hidden; }
  .post-img-wrap img, .post-img-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .trend-badge{
    position:absolute; top:12px; left:12px; padding:5px 11px; border-radius:20px;
    background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke);
    font-size:11px; font-weight:600; display:flex; align-items:center; gap:4px;
    background-image:linear-gradient(100deg, var(--magenta), var(--lime));
    -webkit-background-clip:text; background-clip:text;
  }
  .trend-badge span{ -webkit-text-fill-color:initial; color:var(--text); background:none; }
  .video-badge{ position:absolute; top:12px; right:12px; width:30px; height:30px; border-radius:50%; background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; z-index:2; }
  .video-badge svg{ width:14px;height:14px; }
  .mute-btn{ position:absolute; bottom:12px; right:12px; width:32px; height:32px; border-radius:50%; background:rgba(7,7,12,0.55); backdrop-filter:blur(8px); border:1px solid var(--stroke); display:flex; align-items:center; justify-content:center; z-index:3; cursor:pointer; }
  .mute-btn svg{ width:15px;height:15px; }
  .play-overlay{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:opacity 0.15s ease; z-index:2; }
  .play-overlay.show{ opacity:1; }
  .play-overlay svg{ width:56px;height:56px; filter:drop-shadow(0 4px 20px rgba(0,0,0,0.6)); }
  .burst-heart{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; z-index:4; }
  .burst-heart svg{ width:90px; height:90px; filter:drop-shadow(0 0 30px var(--magenta)); }
  .burst-heart.pop{ animation:burst 0.75s ease; }
  @keyframes burst{ 0%{opacity:0; transform:scale(0.5);} 25%{opacity:1; transform:scale(1.05);} 40%{transform:scale(0.96);} 75%{opacity:1;} 100%{opacity:0; transform:scale(1.1);} }
  .actions{ display:flex; align-items:center; gap:13px; padding:12px 14px 2px; }
  .actions .icon-btn{ background:transparent; border:none; width:30px; height:30px; backdrop-filter:none; }
  .actions .icon-btn svg{ width:24px; height:24px; }
  .actions .spacer{ flex:1; }
  .heart-btn.liked svg{ fill:var(--magenta); stroke:var(--magenta); filter:drop-shadow(0 0 6px var(--magenta)); }
  .heart-btn.pulse{ animation:pulse 0.35s ease; }
  @keyframes pulse{ 0%{transform:scale(1);} 40%{transform:scale(1.3);} 100%{transform:scale(1);} }
  .bookmark-btn.saved svg{ fill:var(--lime); stroke:var(--lime); filter:drop-shadow(0 0 6px var(--lime)); }
  .likes-line{ padding:2px 16px 0; font-size:13.5px; font-weight:600; }
  .caption{ padding:4px 16px 0; font-size:13.5px; line-height:1.45; }
  .caption b{ font-weight:600; margin-right:5px; }
  .view-comments{ padding:5px 16px 0; font-size:13px; color:var(--muted); cursor:pointer; }
  .timestamp{ padding:6px 16px 14px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; }

  /* floating pill navbar */
  .navbar{
    position:absolute; left:16px; right:16px; bottom:18px; z-index:20;
    display:flex; align-items:center; justify-content:space-around;
    padding:12px 14px; border-radius:28px;
    background:rgba(15,14,22,0.65); backdrop-filter:blur(22px);
    border:1px solid var(--stroke); box-shadow:0 20px 50px -15px rgba(0,0,0,0.7);
    margin-bottom:env(safe-area-inset-bottom,0px);
  }
  .nav-btn{ background:none; border:none; color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; padding:4px; position:relative; }
  .nav-btn svg{ width:23px; height:23px; }
  .nav-btn.active{ color:var(--text); filter:drop-shadow(0 0 6px var(--cyan)); }
  .nav-btn.camera-nav{
    width:46px; height:36px; border-radius:14px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta), var(--lime));
    background-size:250% auto; animation:hueflow 5s linear infinite;
  }
  .nav-btn .profile-dot{
    width:24px;height:24px;border-radius:50%;
    background:linear-gradient(135deg, var(--lime), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk'; font-weight:700; font-size:10.5px; color:#0A0A10; border:2px solid transparent;
  }
  .nav-btn.active .profile-dot{ border-color:var(--text); }
  .nav-dot{ position:absolute; top:-1px; right:2px; width:7px;height:7px;border-radius:50%; background:var(--magenta); box-shadow:0 0 5px var(--magenta); display:none; }
  .nav-dot.show{ display:block; }

  /* search grid */
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:4px 14px; }
  .grid3 .cell{ aspect-ratio:1; overflow:hidden; background:var(--glass); border-radius:14px; border:1px solid var(--stroke); position:relative; }
  .grid3 .cell img, .grid3 .cell video{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .grid3 .cell .cell-video-tag{ position:absolute; top:5px; right:5px; width:18px;height:18px; }
  .grid3 .cell .cell-video-tag svg{ width:100%;height:100%; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.8)); }
  .search-bar{ margin:8px 16px 12px; position:relative; }
  .search-bar input{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:16px;
    padding:11px 40px 11px 15px; color:var(--text); font-size:14px; font-family:'Inter'; backdrop-filter:blur(10px);
  }
  .search-bar input::placeholder{ color:var(--muted); }
  .search-bar .clear-search{ position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; display:none; padding:5px; }
  .search-bar .clear-search.show{ display:block; }
  .search-empty{ text-align:center; padding:50px 30px; color:var(--muted); font-size:13.5px; }

  /* profile */
  .profile-head{ padding:18px 20px 10px; display:flex; gap:18px; align-items:center; }
  .profile-avatar{
    width:78px;height:78px;border-radius:50%; flex-shrink:0;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--violet), var(--cyan));
    display:flex; align-items:center; justify-content:center; animation:spin 8s linear infinite;
  }
  .profile-avatar span{ width:70px;height:70px;border-radius:50%; background:#0B0B14; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; font-size:26px; }
  .profile-stats{ display:flex; gap:22px; }
  .profile-stats div{ text-align:center; }
  .profile-stats .num{ font-family:'Space Grotesk'; font-weight:700; font-size:16px; }
  .profile-stats .lbl{ font-size:11.5px; color:var(--muted); }
  .profile-bio{ padding:0 20px 10px; font-size:13.5px; }
  .profile-bio b{ display:block; font-size:14px; margin-bottom:2px; }
  .profile-tabs{ display:flex; gap:8px; padding:6px 18px 12px; }
  .profile-tab{ flex:1; text-align:center; padding:9px; border-radius:14px; background:var(--glass); border:1px solid var(--stroke); font-size:12.5px; font-weight:600; font-family:'Space Grotesk'; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .profile-tab svg{ width:15px;height:15px; }
  .profile-tab.active{ color:var(--text); background:var(--glass-2); box-shadow:inset 0 0 0 1px rgba(255,255,255,0.16); }
  .empty-state{ text-align:center; padding:60px 30px; color:var(--muted); }
  .empty-state button{
    margin-top:16px; border:none; padding:11px 22px; border-radius:20px; color:#0A0A10;
    background:linear-gradient(120deg, var(--cyan), var(--magenta)); font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; cursor:pointer;
  }

  /* activity */
  .activity-item{ display:flex; align-items:center; gap:12px; padding:11px 18px; }
  .activity-item .avatar{ width:38px;height:38px;border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk'; font-weight:700; color:#0A0A10; font-size:14px; overflow:hidden;}
  .activity-item .avatar img{ width:100%;height:100%;object-fit:cover; }
  .activity-item .txt{ flex:1; font-size:13.5px; line-height:1.4; }
  .activity-item .txt .u{ font-weight:600; }
  .activity-item .time{ font-size:11.5px; color:var(--muted); }
  .activity-item .thumb{ width:40px;height:40px; border-radius:10px; object-fit:cover; flex-shrink:0; border:1px solid var(--stroke);}
  .section-title{ font-family:'Space Grotesk'; font-weight:600; font-size:15px; padding:14px 18px 6px; }

  /* camera overlay */
  .camera-view{ position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:30; }
  .camera-view.active{ display:flex; }
  .camera-view video{ flex:1; width:100%; object-fit:cover; background:#000; }
  .camera-topbar{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:16px; right:16px; display:flex; justify-content:space-between; z-index:2;}
  .camera-controls{ display:flex; align-items:center; justify-content:space-around; padding:16px 30px calc(env(safe-area-inset-bottom,10px) + 16px); background:#000; }
  .mode-switch{ position:absolute; bottom:118px; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:22px; z-index:2; }
  .mode-switch button{ background:none; border:none; color:rgba(255,255,255,0.55); font-family:'Space Grotesk'; font-weight:600; font-size:12.5px; letter-spacing:0.5px; cursor:pointer; padding:4px 2px; text-transform:uppercase; }
  .mode-switch button.active{ color:#fff; text-shadow:0 0 10px var(--cyan); }
  .shutter{
    width:68px; height:68px; border-radius:50%; cursor:pointer; padding:3px;
    background:conic-gradient(from 0deg, var(--cyan), var(--magenta), var(--lime), var(--cyan));
    animation:spin 4s linear infinite; border:none;
    display:flex; align-items:center; justify-content:center; position:relative;
  }
  .shutter::after{ content:""; width:100%; height:100%; border-radius:50%; background:#0A0A10; transition:border-radius 0.2s ease, background 0.2s ease; }
  .shutter.recording{ animation:none; background:var(--danger); }
  .shutter.recording::after{ border-radius:16px; width:60%; height:60%; background:var(--danger); }
  .rec-timer{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:50%; transform:translateX(-50%); background:rgba(255,92,108,0.9); color:#fff; font-family:'Space Grotesk'; font-weight:700; font-size:12px; padding:5px 12px; border-radius:14px; display:none; align-items:center; gap:6px; z-index:3; }
  .rec-timer.show{ display:flex; }
  .rec-timer .dot{ width:7px;height:7px;border-radius:50%; background:#fff; animation:blink 1s infinite; }
  @keyframes blink{ 50%{opacity:0.3;} }
  .cam-side-btn{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.12); backdrop-filter:blur(10px); border:1px solid var(--stroke); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .cam-side-btn svg{ width:22px;height:22px; }
  .camera-hint{ position:absolute; bottom:150px; left:0; right:0; text-align:center; color:rgba(255,255,255,0.75); font-size:12.5px; z-index:2;}
  #fileInput{ display:none; }

  .preview-view{ position:absolute; inset:0; background:#07070C; display:none; flex-direction:column; z-index:31; }
  .preview-view.active{ display:flex; }
  .preview-img-wrap{ flex:1; overflow:hidden; background:#000; }
  .preview-img-wrap img, .preview-img-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-bottom{ padding:14px 18px calc(env(safe-area-inset-bottom,10px) + 14px); background:rgba(15,14,22,0.9); backdrop-filter:blur(20px); border-top:1px solid var(--stroke); }
  .ai-suggest-btn{
    display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:16px;
    background:var(--glass-2); border:1px solid var(--stroke); color:var(--text); font-size:12px; font-weight:600;
    cursor:pointer; margin-bottom:10px; font-family:'Inter';
  }
  .ai-suggest-btn svg{ width:14px; height:14px; }
  .preview-bottom textarea{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:14px;
    color:var(--text); font-family:'Inter'; font-size:13.5px; padding:10px 12px; resize:none; height:52px; margin-bottom:10px;
  }
  .preview-bottom input.loc-input{
    width:100%; background:var(--glass); border:1px solid var(--stroke); border-radius:14px;
    color:var(--text); font-family:'Inter'; font-size:12.5px; padding:9px 12px; margin-bottom:10px;
  }
  .preview-actions{ display:flex; gap:10px; }
  .preview-actions button{ flex:1; padding:12px; border-radius:14px; border:none; font-family:'Space Grotesk'; font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn-discard{ background:var(--glass-2); color:var(--text); }
  .btn-share{ background:linear-gradient(120deg, var(--cyan), var(--magenta)); color:#0A0A10; }
  .btn-share:disabled{ opacity:0.6; }

  /* story viewer */
  .story-view{ position:absolute; inset:0; background:#000; display:none; flex-direction:column; z-index:40; }

  function openPreview(){const wrap=document.getElementById('previewMediaWrap'),url=URL.createObjectURL(capturedBlob);wrap.innerHTML=capturedMediaType==='video'?`<video src="${url}" controls playsinline muted autoplay loop></video>`:`<img src="${url}" alt="preview">`;document.getElementById('captionInput').value='';document.getElementById('locInput').value='';document.getElementById('previewView').classList.add('active')}
  document.getElementById('closePreviewBtn').onclick=document.getElementById('discardBtn').onclick=()=>{document.getElementById('previewView').classList.remove('active');document.getElementById('previewMediaWrap').innerHTML='';capturedBlob=null};document.getElementById('aiSuggestBtn').onclick=()=>document.getElementById('captionInput').value=CAPTION_IDEAS[Math.floor(Math.random()*CAPTION_IDEAS.length)];

  document.getElementById('shareBtn').onclick=async()=>{const btn=document.getElementById('shareBtn');btn.disabled=true;document.getElementById('uploadProgress').classList.add('show');try{if(!capturedBlob)throw new Error('sem midia');const caption=document.getElementById('captionInput').value.trim()||'novo momento capturado ✨',loc=document.getElementById('locInput').value.trim()||'Agora';const ext=capturedMediaType==='video'?'webm':'jpg',path=`posts/${currentUser.uid}/${uid()}.${ext}`,storageRef=ref(storage,path);await uploadBytes(storageRef,capturedBlob,{contentType:capturedBlob.type});const mediaUrl=await getDownloadURL(storageRef);let thumbnailUrl=null;if(capturedMediaType==='video'&&capturedThumb){const res=await fetch(capturedThumb);const thumbBlob=await res.blob();const thumbRef=ref(storage,`posts/${currentUser.uid}/${uid()}-thumb.jpg`);await uploadBytes(thumbRef,thumbBlob,{contentType:'image/jpeg'});thumbnailUrl=await getDownloadURL(thumbRef)}await addDoc(collection(db,'posts'),{userId:currentUser.uid,user:'voce',username:currentProfile.username,loc,mediaType:capturedMediaType,mediaUrl,thumbnailUrl,storagePath:path,caption,likeCount:0,commentCount:0,createdAt:serverTimestamp()});document.getElementById('previewView').classList.remove('active');document.getElementById('previewMediaWrap').innerHTML='';document.getElementById('cameraView').classList.remove('active');stopStream();switchView('feed');showToast('Publicado!')}catch(e){console.error(e);showToast('Erro ao publicar, tente novamente')}finally{btn.disabled=false;document.getElementById('uploadProgress').classList.remove('show')}};

  function switchView(name){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+name).classList.add('active');document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));if(name==='search')renderSearch(document.getElementById('searchInput').value);if(name==='profile')renderProfile();if(name==='activity'){renderActivity();markActivityRead();}}
  document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('navCamera').onclick=openCamera;document.getElementById('topActivityBtn').onclick=()=>switchView('activity');document.getElementById('topSearchBtn').onclick=()=>switchView('search');
  const searchInput=document.getElementById('searchInput');searchInput.oninput=()=>{document.getElementById('clearSearchBtn').classList.toggle('show',!!searchInput.value);renderSearch(searchInput.value)};document.getElementById('clearSearchBtn').onclick=()=>{searchInput.value='';document.getElementById('clearSearchBtn').classList.remove('show');renderSearch('');searchInput.focus()};
  function renderAll(){renderStories();renderFeed();renderSearch('');renderActivity();renderProfile()}
  function tick(){document.getElementById('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;document.getElementById('installBtn').classList.add('show')});document.getElementById('installBtn').onclick=async()=>{if(!deferredInstallPrompt)return;deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;document.getElementById('installBtn').classList.remove('show')};window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').classList.remove('show');showToast('VIBE instalado!')});if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

  onAuthStateChanged(auth,async user=>{if(!user)return;currentUser=user;try{await ensureProfile(user);subscribePosts();subscribeActivity();renderAll();}catch(e){console.error(e);showToast('Configure o Firebase para iniciar o VIBE')}});
  signInAnonymously(auth).catch(e=>{console.error(e);showToast('Ative o login anonimo no Firebase')});
})();
</script>
</body>
</html>
